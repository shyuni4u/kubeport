name: build-images

# Multi-arch (linux/amd64 + linux/arm64) Docker images for backend + frontend.
# Pushed to ghcr.io/shyuni4u/kubeport-backend and -frontend.
# See ADR 0003 §"공통 스택" — multi-arch is required for Phase 1↔2/3 zero-touch
# (x86 GCP bootstrap → ARM OCI/Hetzner production without rebuild).
#
# Images are published only by a push event: a push to main, or a `v*` tag.
# A PR builds amd64 only and pushes nothing — see the comments on `platforms:`
# and on the `pull_request:` paths below. A workflow_dispatch builds both arches
# (it can answer "does arm64 still build" for a branch) but also pushes nothing:
# deploy/oci/kubeport-deploy.sh deploys `sha-<7>`, and a dispatched build of an
# unmerged branch must not be able to publish a tag of that shape.

on:
  # No paths filter here, deliberately. docs/oci-prod-runbook.md deploys with
  # `NEWSHA=$(git rev-parse --short=7 HEAD)` and pins `sha-$NEWSHA`, so every
  # main commit has to have an image — a docs-only commit at HEAD used to leave
  # the operator pinning a tag that was never published. The same filter applied
  # to tags, so a release tagged on a docs commit published nothing at all.
  #
  # The cost is a build on commits that could not have changed the image. That
  # is the right side to be wrong on: the alternative fails at deploy time, on
  # someone else's terminal.
  push:
    branches: [main]
    tags: ['v*.*.*']
  # A PR never pushes an image (see `push:` on the build step), so this run only
  # answers "does the image still build". That question is decided by the
  # Dockerfiles and the files they name — not by every source file under
  # backend/ or frontend/, which is what used to trigger it. A CSS-only PR was
  # paying 4½ minutes to rebuild an image nobody would pull.
  #
  # Ordinary source changes are covered without this job: `go vet ./...` plus
  # `go test ./...` compile everything the backend image builds, and ci.yml's
  # frontend job now runs `pnpm build`.
  #
  # next.config.ts is here because `pnpm build` does NOT cover it. Dropping
  # `output: "standalone"` leaves the build green while the frontend Dockerfile
  # fails at `COPY /app/.next/standalone`; outputFileTracingIncludes decides
  # what lands in that directory. pnpm-workspace.yaml is copied by name in the
  # dependency stage.
  #
  # The `push:` paths above stay broad on purpose: main really does publish, so
  # any source change has to produce a new image.
  pull_request:
    branches: [main]
    paths:
      # Named rather than '**/Dockerfile': there are exactly two build contexts,
      # and a glob would also wake this job for a Dockerfile added somewhere
      # that has nothing to do with either image. Being exact is the point of
      # this filter.
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/pnpm-workspace.yaml'
      - 'frontend/next.config.ts'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # ghcr.io push 권한

# A new push supersedes the previous run on the same ref. Without this a burst
# of review fixes left three multi-arch builds running against commits nobody
# was waiting on any more.
#
# Pull requests only. This job publishes on main and on tags, and
# docs/oci-prod-runbook.md deploys by pinning `sha-<shortsha>` — losing a main
# run leaves that sha with no image in ghcr, so an operator pinning it (or
# rolling back to it) meets ImagePullBackOff. A superseded PR build produces
# nothing anyone can pin, so there it is free.
#
# Non-PR runs get a group of their own (run_id is unique) rather than sharing
# one with cancel-in-progress off. `cancel-in-progress: false` only protects the
# run that is already executing: GitHub keeps a single *pending* run per group,
# so with three merges in quick succession the third cancels the second while it
# waits, and that commit is never built. A per-run group means main and tag
# builds never queue against each other at all.
concurrency:
  group: build-images-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Lowercase owner for OCI image names. github.repository_owner can be mixed case;
  # we hardcode here since registry refs must be lowercase.
  IMAGE_NAMESPACE: shyuni4u

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation when needed)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # push 이벤트(main·v* 태그)만 이미지를 올린다 — PR·dispatch 는 로그인 자체를 건너뜀
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend reports this on /healthz, and deploy.yml waits for it to
      # equal the sha it deployed. It must be the same seven characters as the
      # `type=sha,format=short` tag below (metadata-action's default short
      # length is 7), so it is cut here rather than left to git describe or
      # ref_name, which is what it used to be (`main-<40 hex>`).
      - name: Short sha for the build version
        id: ver
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kubeport-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # arm64 is built under QEMU emulation and accounts for most of this
          # job's runtime. On a PR the image is thrown away, so pay for it where
          # the artifact is actually kept: main and tags publish both arches,
          # which is what ADR 0003 requires for the x86→ARM move.
          #
          # The trade: an arm64-only build break surfaces on main instead of on
          # the PR. Neither Dockerfile branches on architecture today, and main
          # still gates before anything is deployed.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # main push·v* 태그 push 만 올린다. PR·workflow_dispatch 는 build only —
          # dispatch 는 아무 브랜치에서나 돌릴 수 있어, 올리면 main 에 없는 커밋이
          # 배포 스크립트가 쓰는 `sha-<7>` 태그를 갖게 된다.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache — backend/frontend 별로 분리해서 cross-pollination 방지
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          # Provenance/SBOM 생성은 CD 단순화 위해 일단 끔 (필요 시 켜기)
          provenance: false
          build-args: |
            VERSION=${{ steps.ver.outputs.short }}
