name: Playwright E2E

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/docker/**'
      - '.github/workflows/playwright.yml'
  push:
    branches: [main]

# A new push supersedes the previous run on the same ref. This one stands up a
# kind cluster for ~4 minutes, so a superseded run is worth cancelling.
#
# Pull requests only: on main this is the only end-to-end signal a commit gets,
# and losing it would let a merge slip through with no e2e result at all rather
# than a failing one.
#
# Non-PR runs get a group of their own (run_id is unique). `cancel-in-progress:
# false` alone is not enough — GitHub keeps only one *pending* run per group, so
# a third merge cancels the second while it is still queued.
concurrency:
  group: playwright-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token (#174). Nothing here writes to the repository — artifacts go
# up through the runner's own token — and without this a push to main runs with
# whatever the repository's default permissions are. Matches ci.yml.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    # Raised from 20 when the kind-backed Go tests moved in (#121): they compile
    # the internal/api test binary, which `go build ./cmd/server` does not warm.
    # That step carries its own timeout-minutes, so if the budget does get tight
    # it shows up there instead of as a bare job timeout somebody reads as their
    # own PR's fault.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Add host.docker.internal to hosts
        # Dex's issuer claim is https://host.docker.internal:5556; tokens only
        # validate when both k8s apiserver and backend can resolve it to dex.
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Generate self-signed dex cert
        run: |
          mkdir -p deploy/docker/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
            -keyout deploy/docker/certs/dex.key \
            -out deploy/docker/certs/dex.crt \
            -subj "/CN=host.docker.internal" \
            -addext "subjectAltName=DNS:host.docker.internal,DNS:localhost,IP:127.0.0.1"
          chmod 644 deploy/docker/certs/dex.key

      - name: Start compose (postgres + dex)
        run: docker compose -f deploy/docker/docker-compose.yml up -d

      - name: Wait for dex
        run: |
          for i in $(seq 1 30); do
            if curl -sk https://localhost:5556/.well-known/openid-configuration >/dev/null; then
              echo "dex ready"; exit 0
            fi
            sleep 2
          done
          echo "dex failed to start"; exit 1

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3

      - name: Apply DB schema
        # atlas.hcl lives in backend/migrations/ — matches docs/local-e2e.md §3.
        run: cd backend/migrations && atlas schema apply --env local --auto-approve

      - name: Write kind config
        run: |
          cat > /tmp/kind-config.yaml <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: kubeport
          nodes:
            - role: control-plane
              extraMounts:
                - hostPath: ${{ github.workspace }}/deploy/docker/certs/dex.crt
                  containerPath: /etc/kubernetes/pki/dex-ca.crt
                  readOnly: true
              extraPortMappings:
                - containerPort: 6443
                  hostPort: 6443
                  listenAddress: 127.0.0.1
              kubeadmConfigPatches:
                - |
                  kind: ClusterConfiguration
                  apiServer:
                    extraArgs:
                      oidc-issuer-url: https://host.docker.internal:5556
                      oidc-client-id: kubeport
                      oidc-username-claim: email
                      oidc-groups-claim: groups
                      oidc-ca-file: /etc/kubernetes/pki/dex-ca.crt
          EOF

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kubeport
          config: /tmp/kind-config.yaml

      - name: Expose host.docker.internal to kube-apiserver
        # GitHub Actions Linux runners do not auto-inject host.docker.internal
        # into container networking (Docker Desktop does). The kube-apiserver
        # static pod has its OWN /etc/hosts — modifying the kind node's
        # /etc/hosts is not enough. Patch the static pod manifest to add a
        # hostAliases entry; kubelet detects the change and restarts apiserver,
        # which then resolves the Dex issuer on the next JWKS fetch.
        run: |
          set -eo pipefail
          # Kind node's default route IS the kind docker network gateway
          # (i.e. the host-side of the bridge). This works for both IPv4-only
          # and dual-stack runners without parsing docker network JSON, and
          # matches what hostNetwork pods see through their shared netns.
          GATEWAY=$(docker exec kubeport-control-plane sh -c "ip -4 route show default | awk '{print \$3}'" | head -1)
          if [ -z "$GATEWAY" ]; then
            echo "could not determine kind node default gateway" >&2
            docker exec kubeport-control-plane ip route >&2 || true
            exit 1
          fi
          echo "gateway: $GATEWAY"
          docker cp kubeport-control-plane:/etc/kubernetes/manifests/kube-apiserver.yaml /tmp/apiserver.yaml
          awk -v gw="$GATEWAY" '
            /^spec:$/ && !done {
              print
              print "  hostAliases:"
              print "  - ip: " gw
              print "    hostnames:"
              print "    - host.docker.internal"
              done = 1
              next
            }
            { print }
          ' /tmp/apiserver.yaml > /tmp/apiserver-patched.yaml
          docker cp /tmp/apiserver-patched.yaml kubeport-control-plane:/etc/kubernetes/manifests/kube-apiserver.yaml
          # Also patch the node /etc/hosts for good measure (anything that execs
          # in the node directly, e.g. crictl debug, benefits from resolution).
          docker exec kubeport-control-plane sh -c "echo '$GATEWAY host.docker.internal' >> /etc/hosts"
          # Wait for kubelet to pick up the manifest change and restart apiserver.
          # A successful /healthz response means the apiserver came back up from
          # the patched manifest — i.e. hostAliases is in effect. We don't exec
          # into the pod to verify /etc/hosts because the apiserver image is
          # distroless (no shell/cat).
          for i in $(seq 1 40); do
            if kubectl --context kind-kubeport get --raw /healthz 2>/dev/null | grep -q ok; then
              echo "apiserver healthy after patch (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "apiserver did not recover after patch" >&2
          docker exec kubeport-control-plane crictl ps -a >&2 || true
          exit 1

      - name: Build backend
        run: cd backend && go build -o ../bin/kubeport-server ./cmd/server

      - name: Run backend
        # Secrets below are documented local-dev values (see docs/local-e2e.md
        # and deploy/docker/dex.yaml). They're ephemeral per CI run — do NOT
        # move to Actions secrets; keeping them inline preserves "clone → run
        # locally" parity. Never use these values in prod.
        env:
          LISTEN_ADDR: ":8080"
          DATABASE_URL: "postgres://kubeport:kubeport@localhost:5432/kubeport?sslmode=disable"
          OIDC_ISSUER: "https://host.docker.internal:5556"
          OIDC_AUDIENCE: "kubeport"
          OIDC_CA_FILE: "${{ github.workspace }}/deploy/docker/certs/dex.crt"
          APP_ENCRYPTION_KEY_B64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          KBP_DEV_ADMIN_EMAILS: "admin@example.com,demo-admin@demo.kubeport"
          KBP_DEMO_EMAIL_DOMAIN: "demo.kubeport"
        run: |
          nohup ./bin/kubeport-server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Register kind cluster + warm users
        run: |
          ADM=$(curl -sk -X POST https://host.docker.internal:5556/token \
            -d grant_type=password -d client_id=kubeport -d client_secret=local-dev-secret \
            -d username=admin@example.com -d password=admin \
            -d 'scope=openid email profile groups' | jq -r .id_token)
          KIND_CA=$(kubectl --context kind-kubeport config view --raw --minify --flatten -o json \
            | jq -r '.clusters[0].cluster."certificate-authority-data"' | base64 -d)
          jq -n --arg ca "$KIND_CA" '{name:"kind",api_url:"https://127.0.0.1:6443",ca_bundle:$ca,oidc_issuer_url:"https://host.docker.internal:5556"}' \
            | curl -fs -H "Authorization: Bearer $ADM" -H 'content-type: application/json' \
              -X POST http://localhost:8080/v1/clusters -d @- >/dev/null
          ALI=$(curl -sk -X POST https://host.docker.internal:5556/token \
            -d grant_type=password -d client_id=kubeport -d client_secret=local-dev-secret \
            -d username=alice@example.com -d password=alice \
            -d 'scope=openid email profile groups' | jq -r .id_token)
          # /v1/me is the warm-up endpoint that upserts the user row so
          # admin can add them to teams.
          curl -fs -H "Authorization: Bearer $ALI" http://localhost:8080/v1/me >/dev/null
          DEMO_ADMIN_TOK=$(curl -sk -X POST https://host.docker.internal:5556/token \
            -d grant_type=password -d client_id=kubeport -d client_secret=local-dev-secret \
            -d username=demo-admin@demo.kubeport -d password=demo \
            -d 'scope=openid email profile groups' | jq -r .id_token)
          curl -fs -H "Authorization: Bearer $DEMO_ADMIN_TOK" http://localhost:8080/v1/me >/dev/null
          DEMO_USER_TOK=$(curl -sk -X POST https://host.docker.internal:5556/token \
            -d grant_type=password -d client_id=kubeport -d client_secret=local-dev-secret \
            -d username=demo-user@demo.kubeport -d password=demo \
            -d 'scope=openid email profile groups' | jq -r .id_token)
          curl -fs -H "Authorization: Bearer $DEMO_USER_TOK" http://localhost:8080/v1/me >/dev/null
          # kind trusts the id_token email claim verbatim (no username prefix).
          # The apiserver was restarted by the hostAliases patch above and can
          # still be flapping here ("EOF" on the first write) — retry, and use
          # apply so a retry after a half-applied create is idempotent.
          bind() {
            for attempt in 1 2 3 4 5 6; do
              if kubectl --context kind-kubeport create rolebinding "$1" --clusterrole="$2" --user="$3" -n default \
                   --dry-run=client -o yaml | kubectl --context kind-kubeport apply -f -; then
                return 0
              fi
              echo "rolebinding $1: attempt $attempt failed, retrying" >&2
              sleep 5
            done
            return 1
          }
          bind demo-admin admin demo-admin@demo.kubeport
          bind demo-user  edit  demo-user@demo.kubeport
          # TestApplyAll_IntegrationWithKind applies a ConfigMap to `default` as
          # this identity. dex authenticates it but nothing here granted it
          # anything, so without this it is a 403. Scoped to that one verb set
          # rather than `edit`, because `default` is also where
          # 05-user-deploy.spec.ts creates and deletes real releases, and `edit`
          # would hand this identity their secrets and workloads too.
          #
          # The OpenAPI tests need none of this: /openapi/* is a nonResourceURL,
          # which a RoleBinding cannot grant at all — `system:discovery` already
          # gives it to system:authenticated.
          kubectl --context kind-kubeport apply -f - <<'YAML'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata: { name: e2e-configmap-apply, namespace: default }
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "create", "patch"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata: { name: e2e-admin, namespace: default }
          subjects: [{ kind: User, name: "admin@example.com", apiGroup: rbac.authorization.k8s.io }]
          roleRef: { kind: Role, name: e2e-configmap-apply, apiGroup: rbac.authorization.k8s.io }
          YAML

      # ci.yml claimed this workflow was the gate for the kind-backed Go tests
      # while it ran no `go test` at all, so they had never executed anywhere
      # (#121). Everything they need is already built above, so this is wiring,
      # not new infrastructure. It runs before the seeder on purpose: at this
      # point the database holds only the registered cluster and warmed users,
      # so nothing these tests write can disturb the fixtures the specs assert
      # on. internal/api's TestMain only deletes rows whose names end in the
      # -HHMMSS.micros fixture suffix, which no seeded or workflow-created row
      # has.
      - name: Go tests that need a cluster
        timeout-minutes: 8
        env:
          TEST_DATABASE_URL: "postgres://kubeport:kubeport@localhost:5432/kubeport?sslmode=disable"
          KIND_API: "https://127.0.0.1:6443"
          # Turns every kind-backed t.Skip in these packages into a failure.
          # Without it the step is green whether or not the wiring below still
          # resolves — a suite that skips itself gates nothing, which is how
          # these tests went so long without running anywhere (#121). Same
          # bargain as KBP_REQUIRE_DEX in ci.yml.
          #
          # Deliberately not a list of test names here: a hand-kept allowlist in
          # a workflow file is the thing that failed. The tests opt in by asking
          # for the harness, so a new one is covered on the day it is written and
          # a renamed or deleted one takes itself out honestly.
          KBP_REQUIRE_KIND: "1"
        run: |
          set -o pipefail
          # --cacert, not -k. The cert is generated by this same job and the
          # backend, frontend and seeder all verify against it; only the curl
          # calls in this file turn verification off, and a new one should not
          # deepen that groove. The SAN covers host.docker.internal.
          DEX_TOKEN=$(curl -s --cacert "$GITHUB_WORKSPACE/deploy/docker/certs/dex.crt" \
            -X POST https://host.docker.internal:5556/token \
            -d grant_type=password -d client_id=kubeport -d client_secret=local-dev-secret \
            -d username=admin@example.com -d password=admin \
            -d 'scope=openid email profile groups' | jq -r .id_token)
          [ -n "$DEX_TOKEN" ] && [ "$DEX_TOKEN" != "null" ] || { echo "no admin id_token from dex" >&2; exit 1; }
          # Nothing prints it today, but `go test -v` failures are verbose and
          # this is a bearer token for a live cluster.
          echo "::add-mask::$DEX_TOKEN"
          export DEX_TOKEN
          KIND_CA=$(kubectl --context kind-kubeport config view --raw --minify --flatten -o json \
            | jq -r '.clusters[0].cluster."certificate-authority-data"' | base64 -d)
          export KIND_CA
          # -v so the log names the tests that ran. KBP_REQUIRE_KIND is what
          # gates; this is so a human can see which kind-backed tests executed
          # without inferring it from an exit code — the distinction this whole
          # change is about.
          cd backend && go test -p 1 -v ./internal/api/ ./internal/k8s/

      - name: Seed demo data
        env:
          # The seeder writes templates straight to the database, so this is
          # required whether or not --reset is passed. Step env is not shared
          # with the backend step above.
          DATABASE_URL: "postgres://kubeport:kubeport@localhost:5432/kubeport?sslmode=disable"
          DEMO_OIDC_ISSUER: "https://host.docker.internal:5556"
          DEMO_OIDC_CLIENT_ID: "kubeport"
          DEMO_OIDC_CLIENT_SECRET: "local-dev-secret"
          OIDC_CA_FILE: "${{ github.workspace }}/deploy/docker/certs/dex.crt"
          KBP_API_BASE_URL: "http://localhost:8080"
          DEMO_ADMIN_EMAIL: "demo-admin@demo.kubeport"
          DEMO_ADMIN_PASSWORD: "demo"
          DEMO_USER_EMAIL: "demo-user@demo.kubeport"
          DEMO_USER_PASSWORD: "demo"
          DEMO_CLUSTER: "kind"
          DEMO_NAMESPACE: "default"
          KBP_DEMO_EMAIL_DOMAIN: "demo.kubeport"
        run: cd backend && go run ./cmd/seed-demo

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Write frontend .env.local
        # Values must agree with the backend env above. OIDC_CLIENT_SECRET and
        # issuer match deploy/docker/dex.yaml.
        run: |
          cat > frontend/.env.local <<EOF
          DATABASE_URL=postgres://kubeport:kubeport@localhost:5432/kubeport
          APP_ENCRYPTION_KEY_B64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GO_API_BASE_URL=http://localhost:8080
          OIDC_ISSUER=https://host.docker.internal:5556
          OIDC_CLIENT_ID=kubeport
          OIDC_CLIENT_SECRET=local-dev-secret
          OIDC_REDIRECT_URI=http://localhost:3000/api/auth/callback

          DEMO_OIDC_ISSUER=https://host.docker.internal:5556
          DEMO_OIDC_CLIENT_ID=kubeport
          DEMO_OIDC_CLIENT_SECRET=local-dev-secret
          DEMO_EMAIL_DOMAIN=demo.kubeport
          DEMO_ADMIN_EMAIL=demo-admin@demo.kubeport
          DEMO_USER_EMAIL=demo-user@demo.kubeport
          DEMO_PASSWORD_HINT=demo
          EOF

      - name: Run frontend
        env:
          NODE_EXTRA_CA_CERTS: "${{ github.workspace }}/deploy/docker/certs/dex.crt"
        run: |
          cd frontend && nohup pnpm dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "frontend ready"; exit 0
            fi
            sleep 3
          done
          echo "frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright
        env:
          NODE_EXTRA_CA_CERTS: "${{ github.workspace }}/deploy/docker/certs/dex.crt"
        run: cd frontend && pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
