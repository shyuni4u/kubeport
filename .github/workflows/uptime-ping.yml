name: uptime-ping

# Keep the OCI Always Free A1 instance from being reclaimed as "idle".
# OCI flags an instance for reclaim only if, over 7 days, its 95th-percentile
# CPU < 20% AND network < 20% AND memory < 20% — ALL three. A low-traffic demo
# can drift into that state, so we generate a little inbound traffic + app CPU
# on a schedule. This also doubles as a cheap external liveness check.
#
# GitHub cron is best-effort (can be delayed under load) and only runs on the
# default branch. ~every 10 minutes is plenty for the 7-day idle window.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          URL: https://kubeport.enzo.kr/
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$URL" || echo 000)
          echo "GET $URL -> $code"
          # Any HTTP response (even a redirect/401) proves the ingress + app are
          # serving and generates the network/CPU we need. Only a connection
          # failure (000) is a real problem.
          if [ "$code" = "000" ]; then
            echo "::error::No HTTP response from $URL (connection failed)"
            exit 1
          fi

      # The demo reset wipes first and re-seeds second, so a failed seed leaves
      # an empty catalog. Nothing noticed that for up to six hours — #104 was
      # found only because a browser review happened to run just after a reset.
      # This job already runs every ten minutes, so it is the cheapest place to
      # look (#119).
      #
      # `catalog` is absent unless the deployment opted in
      # (demo.publicHealthCatalog), so a self-hosted or flag-off install skips
      # this check rather than failing it.
      - name: Check the demo catalog is seeded
        env:
          URL: https://kubeport.enzo.kr/api/healthz
        run: |
          body=$(curl -sS --max-time 30 --retry 2 "$URL" || echo '')
          echo "GET $URL -> ${body:-<no body>}"
          if [ -z "$body" ]; then
            echo "::error::No body from $URL — the health endpoint itself is down"
            exit 1
          fi

          # Order matters. "degraded" and "available: false" both omit
          # catalog.templates, so testing for the field first would read an
          # outage as "reporting is switched off" and pass. An empty demo and a
          # database we cannot ask about are both things someone must look at.
          status=$(printf '%s' "$body" | jq -r '.status // "unknown"')
          if [ "$status" != "ok" ]; then
            echo "::error::Health reports status=$status — the API or its database is unhealthy."
            exit 1
          fi
          if [ "$(printf '%s' "$body" | jq -r '.catalog.available // "absent"')" = "false" ]; then
            echo "::error::Catalog count unavailable — the API could not query its database."
            exit 1
          fi

          count=$(printf '%s' "$body" | jq -r '.catalog.templates // empty')
          if [ -z "$count" ]; then
            # URL is the public demo, the one deployment that opts in. A
            # missing catalog key here does not mean "this deployment does not
            # report" — it means reporting disappeared. `helm upgrade
            # --reuse-values` dropping demo.publicHealthCatalog, or a
            # ConfigMap that did not roll, both land here, and skipping would
            # leave the empty-demo alarm silently blind.
            echo "::error::Health returned no catalog field — demo.publicHealthCatalog is off or the backend ConfigMap did not roll. The empty-demo check is currently blind."
            exit 1
          fi
          echo "catalog.templates = $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Demo catalog is empty — the reset CronJob wiped and failed to re-seed. See docs/oci-prod-runbook.md (demo reset)."
            exit 1
          fi

          # A non-empty catalog is not a fresh one (#148). The reset checks its
          # dependencies before deleting anything (#140), so a cycle that
          # cannot run is skipped with the previous seed left in place — the
          # count above stays green. last_seed dates the catalog, so its age
          # is what shows the daily reset has not happened.
          last_seed=$(printf '%s' "$body" | jq -r '.catalog.last_seed // empty')
          if [ -z "$last_seed" ]; then
            # Same reasoning as the missing catalog field above: next to a
            # non-zero count, a missing last_seed means the skipped-reset check
            # went blind — a backend from before #148 (the minutes between
            # merging it and its deploy, or a rollback) or a regression.
            echo "::error::Health returned no catalog.last_seed — a skipped demo reset is not being checked. The live backend predates #148 or the field regressed."
            exit 1
          fi
          # Judge only the exact shape the backend emits. date -d also takes
          # "tomorrow" or a far-future date, and either would make the age
          # negative and pass; and this value is echoed into the log below.
          # [[ =~ ]] anchors the whole string, where grep would match one line
          # of a value with an embedded newline.
          rfc3339_utc='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if ! [[ $last_seed =~ $rfc3339_utc ]]; then
            echo "::error::catalog.last_seed is not an RFC3339 UTC timestamp — refusing to judge the seed's age."
            exit 1
          fi
          if ! seed_epoch=$(date -u -d "$last_seed" +%s); then
            echo "::error::catalog.last_seed $last_seed did not parse as a date."
            exit 1
          fi
          age=$(( $(date -u +%s) - seed_epoch ))
          echo "catalog.last_seed = $last_seed ($(( age / 3600 ))h ago)"
          if [ "$age" -lt -300 ]; then
            echo "::error::catalog.last_seed $last_seed is in the future — clock skew or a malformed health body."
            exit 1
          fi
          # demo.resetSchedule is daily (21:00 UTC), so a healthy seed is just
          # under 24h old right before the next cycle. Two hours of slack
          # covers the Job's own runtime, a late CronJob start and this cron's
          # drift; past that, at least one cycle did not run. Change this
          # together with demo.resetSchedule: the new interval plus 2h.
          if [ "$age" -gt $(( 26 * 3600 )) ]; then
            echo "::error::Demo catalog last seeded at $last_seed, $(( age / 3600 ))h ago — the daily reset skipped at least one cycle. See docs/oci-prod-runbook.md (demo reset)."
            exit 1
          fi
