name: uptime-ping

# Keep the OCI Always Free A1 instance from being reclaimed as "idle".
# OCI flags an instance for reclaim only if, over 7 days, its 95th-percentile
# CPU < 20% AND network < 20% AND memory < 20% — ALL three. A low-traffic demo
# can drift into that state, so we generate a little inbound traffic + app CPU
# on a schedule. This also doubles as a cheap external liveness check.
#
# GitHub cron is best-effort (can be delayed under load) and only runs on the
# default branch. ~every 10 minutes is plenty for the 7-day idle window.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          URL: https://kubeport.enzo.kr/
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$URL" || echo 000)
          echo "GET $URL -> $code"
          # Any HTTP response (even a redirect/401) proves the ingress + app are
          # serving and generates the network/CPU we need. Only a connection
          # failure (000) is a real problem.
          if [ "$code" = "000" ]; then
            echo "::error::No HTTP response from $URL (connection failed)"
            exit 1
          fi

      # The demo reset wipes first and re-seeds second, so a failed seed leaves
      # an empty catalog. Nothing noticed that for up to six hours — #104 was
      # found only because a browser review happened to run just after a reset.
      # This job already runs every ten minutes, so it is the cheapest place to
      # look (#119).
      #
      # `catalog` is absent unless the deployment opted in
      # (demo.publicHealthCatalog), so a self-hosted or flag-off install skips
      # this check rather than failing it.
      - name: Check the demo catalog is seeded
        env:
          URL: https://kubeport.enzo.kr/api/healthz
        run: |
          body=$(curl -sS --max-time 30 --retry 2 "$URL" || echo '')
          echo "GET $URL -> ${body:-<no body>}"
          if [ -z "$body" ]; then
            echo "::error::No body from $URL — the health endpoint itself is down"
            exit 1
          fi

          # Order matters. "degraded" and "available: false" both omit
          # catalog.templates, so testing for the field first would read an
          # outage as "reporting is switched off" and pass. An empty demo and a
          # database we cannot ask about are both things someone must look at.
          status=$(printf '%s' "$body" | jq -r '.status // "unknown"')
          if [ "$status" != "ok" ]; then
            echo "::error::Health reports status=$status — the API or its database is unhealthy."
            exit 1
          fi
          if [ "$(printf '%s' "$body" | jq -r '.catalog.available // "absent"')" = "false" ]; then
            echo "::error::Catalog count unavailable — the API could not query its database."
            exit 1
          fi

          count=$(printf '%s' "$body" | jq -r '.catalog.templates // empty')
          if [ -z "$count" ]; then
            # Only reachable when status is ok and no catalog key was sent,
            # i.e. demo.publicHealthCatalog is off for this deployment.
            echo "Catalog reporting is off for this deployment — skipping"
            exit 0
          fi
          echo "catalog.templates = $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Demo catalog is empty — the reset CronJob wiped and failed to re-seed. See docs/oci-prod-runbook.md (demo reset)."
            exit 1
          fi
