fields:
  - path: Deployment[web].spec.template.spec.containers[0].image
    label: "웹 서버 버전"
    help: "실행할 웹 서버 프로그램의 버전입니다. 잘 모르면 최신(1.27)을 고르세요."
    type: enum
    values: ["ghcr.io/nginx/nginx-unprivileged:1.27-alpine", "ghcr.io/nginx/nginx-unprivileged:1.26-alpine"]
    default: "ghcr.io/nginx/nginx-unprivileged:1.27-alpine"
  - path: Deployment[web].spec.replicas
    label: "동시에 띄울 개수"
    help: "같은 서버를 몇 개 띄울지 정합니다. 많을수록 한 개가 죽어도 서비스가 이어지지만 자원을 더 씁니다."
    type: integer
    min: 1
    max: 3
    default: 1
  - path: Deployment[web].spec.template.spec.containers[0].env[0].value
    label: "환영 문구"
    help: "브라우저로 접속했을 때 화면에 보여줄 문장입니다."
    type: string
    default: "Hello from kubeport"
  - path: Deployment[web].spec.template.spec.containers[0].resources.limits.memory
    label: "메모리 상한"
    help: "서버 하나가 쓸 수 있는 최대 메모리입니다. 이 데모에서는 128Mi 로 충분합니다."
    type: enum
    values: ["128Mi", "256Mi", "512Mi"]
    default: "128Mi"
