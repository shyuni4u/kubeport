apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/nginx/nginx-unprivileged:1.27-alpine
          ports: [{ containerPort: 8080 }]
          env:
            - name: WELCOME_MESSAGE
              value: "Hello from kubeport"
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
