openapi: 3.1.0

# Hand-written, not generated. Gin does not carry enough type information to
# derive this, so it can drift — `backend/internal/api/openapi_spec_test.go`
# pins the two things most likely to rot: the route list and the error kinds.
#
# NOTE (2026-09-09): PR #47 changes template read authorization (drafts become
# visible only to their editors). The 403/404 wording on the /templates paths
# needs one re-read after that merges.
#
# `redocly lint` reports two warnings that are correct as written; please don't
# "fix" them:
#   - no-server-example.com on http://localhost:8080 — that really is how you
#     reach this API, because the Go service is ClusterIP-only and you get to it
#     through a port-forward. There is no public URL to put here.
#   - operation-4xx-response on /healthz — it takes no input and no auth, so it
#     has no 4xx to document.

info:
  title: kubeport API
  version: "0.1.0"
  license:
    name: MIT
    identifier: MIT
  description: |
    kubeport turns Kubernetes resources into a self-service catalog: admins
    publish versioned templates, everyone else deploys them through generated
    forms.

    **This API is a UX layer, not an authorization boundary.** Every write that
    touches a cluster is performed with the caller's own OIDC id_token, forwarded
    unchanged to that cluster's apiserver. Kubernetes RBAC decides what actually
    happens, so a 201 from kubeport only means kubeport accepted the request —
    the cluster may still refuse it.

    ## Two ways in

    The Go API described here listens on `:8080` **inside the cluster only**
    (`ClusterIP`; the Ingress routes all external traffic to the frontend). It
    takes an OIDC id_token as a bearer token.

    Browsers instead talk to the Next.js BFF at `https://<host>/api/v1/*`, which
    authenticates from an httpOnly session cookie and injects the bearer token
    server-side. It **ignores any `Authorization` header you send**. Paths and
    bodies are otherwise identical to this spec.

    So a script port-forwards to the backend Service and sends a bearer
    id_token. Driving the browser session is **not** a client path: the BFF
    ignores `Authorization`, and the session token never leaves the server (it
    is held encrypted in the `sessions` table, not in the cookie).

    Getting that id_token without a human is solved for the local dex stack and
    unsolved for Google — `docs/machine-clients.md` §2 and §3 spell out which is
    which, and issue #34 tracks the gap.

    ## Correlating a failure

    Every response carries `X-Request-Id`, and every error body repeats it as
    `Problem.request_id`. A 500 no longer tells you what went wrong — the reason
    was leaking connection strings and apiserver addresses (issue #49) — so the
    id is what ties the response you are holding to the server's access-log
    line. Send your own and it is kept, as long as it matches
    `^[A-Za-z0-9._-]{1,64}$`.

    Two paths are rate limited per caller: `POST /v1/selfsubjectaccessreview`
    and the two cluster-openapi reads, which share one budget. A 429 carries
    `Retry-After`.

    ## Every error is a Problem

    There is one error shape and one `ErrorKind` vocabulary, and since #81 that
    now includes the responses no handler produces:

    - a path matching no route is `404 not-found`, not gin's `text/plain`
      `404 page not found`;
    - a wrong verb on a real path is `405 method-not-allowed`, not a 404 —
      folding the two made an agent conclude the resource was gone and stop
      retrying;
    - errors inside an open SSE stream carry the same `Problem` schema as
      errors before it opened (#82).

    No fallback echoes the request path back. A 405 does tell an
    **unauthenticated** caller that the path exists — the fallbacks run on the
    router's global middleware, which is outside the `/v1` group's auth gate,
    and gin's default folds this case into a 404 where this API deliberately
    does not. The trade is accepted: the route list is public in this file
    anyway, a 405 says only that some verb is registered there, and the `Allow`
    header it carries is the point of answering 405 at all.

    What a `detail` may say is bounded by who sent the words. kubeport's own
    are always safe to show. The cluster's are shown only where they answer the
    caller's question — an apiserver RBAC verdict, an unknown group/version —
    and never when they describe the cluster's own internals; those go to the
    log with the request id (#49, #83, #108).

servers:
  - url: http://localhost:8080
    description: |
      The Go API, reached directly — port-forward, or in-cluster. This is the
      server the `bearerAuth` scheme below applies to.
  - url: https://{host}/api
    description: |
      The Next.js BFF. Browser-only: it authenticates from an httpOnly session
      cookie and ignores any `Authorization` header, so `bearerAuth` does not
      apply here. Listed because paths and bodies are identical.
    variables:
      host:
        default: kubeport.example.com
        description: |
          Your install's Ingress host. The project's public demo runs at
          kubeport.enzo.kr — do not point a client at it by accident.

security:
  - bearerAuth: []

tags:
  - name: identity
    description: Who the caller is, and whether they are an admin.
  - name: clusters
    description: |
      Registered deploy targets, and pass-throughs to a target's own apiserver
      (schema discovery, permission checks).
  - name: templates
    description: |
      Versioned blueprints. A template owns many versions; a version is a draft
      until published, and immutable once it is.
  - name: releases
    description: |
      One template version deployed into a cluster and namespace, pinned to that
      version.
  - name: teams
    description: Template ownership and who may edit what.
  - name: meta
    description: Probes. No authentication.

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness probe, build version, and (opt-in) catalog size
      description: |
        The bare path is what the kubelet probes hit: a constant, no database.

        `version` is on every response. It is the short git sha the image was
        built from — the same seven characters as the image's `sha-<7>` tag —
        or `dev` for a binary built without one. The deploy workflow polls it
        to confirm a rollout actually landed.

        `?verbose=1` adds `catalog` only where the operator opted in
        (`KBP_HEALTH_PUBLIC_CATALOG`); otherwise it is the same body as the bare
        path. The status is 200 either way — callers branch on the body.
      security: []
      parameters:
        - name: verbose
          in: query
          required: false
          description: |
            `1` adds detail to the body — on a demo install with a public
            catalog, the published template count, which the uptime ping
            asserts is non-zero so an empty demo is noticed. Any other value,
            or none, returns the bare body `{"status": "ok", "version": "<sha7>"}`.
            The status is 200 either way: this path backs the readiness probe,
            and failing it over a reporting problem would take the pod out of
            service.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Process is up. The bare path does not check the database.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    description: "`degraded` only on `?verbose=1`, when the catalog count could not be read."
                  version:
                    type: string
                    description: Short git sha of the build, or `dev`.
                    examples: [c9b1404]
                  catalog:
                    type: object
                    description: Present only on `?verbose=1` when catalog reporting is opted in.
                    required: [available]
                    properties:
                      available: { type: boolean }
                      templates:
                        type: integer
                        description: Published, demo-owned templates. Absent when `available` is false.

  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The caller as kubeport sees them
      description: |
        Use this to discover whether the caller is an admin: `groups` contains
        `kubeport-admin`. That group comes from the IdP's `groups` claim, or —
        when the IdP does not emit one, as with Google — from the
        `KBP_DEV_ADMIN_EMAILS` allowlist.

        The allowlist is a bootstrap escape hatch, not a role system: the
        backend logs a warning at startup when it is set
        (`cmd/server/main.go`), and enabling demo mode makes the chart append
        the public demo admin's address to it
        (`templates/_helpers.tpl`, `kubeport.devAdminEmails`). Keep it to the
        smallest possible list, and empty it once the IdP emits groups.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [subject, email, groups]
                properties:
                  subject: { type: string }
                  email: { type: string, format: email }
                  groups:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/clusters:
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List clusters available as deploy targets
      description: |
        Returns only what is needed to target a deploy. `api_url`, `ca_bundle`
        and `oidc_issuer_url` are deliberately **not** included for any caller,
        admin included — see issue #52. Register a cluster to see them once, in
        the POST response.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [clusters]
      operationId: createCluster
      summary: Register a cluster as a deploy target
      description: |
        Admin only, and refused for demo-domain callers. There is no
        cluster-registration screen in the admin UI, so this endpoint is the
        supported path — see `deploy/helm/kubeport/README.md`, "After install".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClusterRequest" }
      responses:
        "201":
          description: |
            Created. This is the only response that carries the connection
            fields back, so keep it if you want to verify what was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A cluster with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/clusters/{name}/openapi:
    get:
      tags: [clusters]
      operationId: getClusterOpenAPIIndex
      summary: Group/version index from the target cluster
      description: |
        Proxies the cluster's own OpenAPI discovery, used by the template editor
        to offer resource kinds. Served from an in-process LRU cache.

        **Rate limited**, sharing one per-caller budget with the sibling `{gv}`
        route and `POST /v1/selfsubjectaccessreview`: a cache miss pulls up to
        10 MiB from the apiserver, and a caller can force misses at will by
        varying `gv` (issue #97).

        The cluster's own status codes are **not** passed through, apart from
        404 — see the `{gv}` route for the mapping, which is shared.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "200":
          description: Passed through from the cluster.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            Either kubeport has no such cluster (`not-found`) or the cluster's
            OpenAPI root answered 404 (`k8s-error`). Branch on `title` — the
            two routes share one handler, so both 404s occur here too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ClusterOpenAPIUpstream" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/clusters/{name}/openapi/{gv}:
    get:
      tags: [clusters]
      operationId: getClusterOpenAPIGroupVersion
      summary: Schema for one group/version
      description: |
        Shares the per-caller rate-limit budget with the index route and
        `POST /v1/selfsubjectaccessreview`.

        `gv` is validated before it is joined onto the upstream URL: the group
        must be a DNS subdomain and the version a DNS-1035 label, so a segment
        can carry neither a `/` nor a `..` (issue #11). Anything else is a 400
        rather than a proxied request.

        **The cluster's status codes are folded into kubeport's own** (issue
        #83). Only 404 survives the trip, because "this cluster has no
        `apps/v99`" is the apiserver answering the question that was asked;
        tell it from a missing *cluster* by `title` (`k8s-error` vs
        `not-found`). Everything else the cluster refuses becomes a 502:
        `cluster-auth-denied` for its 401/403, `k8s-error` for the rest.

        The 401/403 fold is the load-bearing one. Passed through, they said
        "your kubeport session is bad" when the cluster had refused the
        forwarded token, so a client would re-authenticate, receive an equally
        unwelcome token, and loop. On these routes a 401 now means only what it
        means everywhere else on `/v1`.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
        - name: gv
          in: path
          required: true
          description: |
            Group and version, e.g. `apps/v1` or `v1`. Matched as a
            trailing wildcard, so it may contain a slash.
          schema: { type: string }
          example: apps/v1
      responses:
        "200":
          description: Passed through from the cluster.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            Either kubeport has no such cluster (`not-found`) or the cluster
            has no such group/version (`k8s-error`). Branch on `title`.

            The apiserver's own words appear in `detail` only for a kubeport
            admin on a non-demo account — the same rule the SSAR `reason`
            follows, and for the same reason: these two routes carry no admin
            gate and no ownership check, so any authenticated caller can point
            them at any registered cluster (#102). Everyone else gets a fixed
            sentence. The status and the title, which is what a client branches
            on, are identical either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ClusterOpenAPIUpstream" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/clusters/{name}/openapi/refresh:
    post:
      tags: [clusters]
      operationId: refreshClusterOpenAPI
      summary: Drop the cached schema for this cluster
      description: |
        Admin only, and refused for demo-domain callers (issue #97) — the same
        gate the other cluster write carries. Clearing the cache makes the next
        read pull the full schema from the apiserver, up to 10 MiB, so an
        ungated version let any authenticated caller amplify load onto the
        control plane.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "204": { description: "Cache cleared. No body." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/selfsubjectaccessreview:
    post:
      tags: [clusters]
      operationId: checkSelfSubjectAccess
      summary: Ask the cluster whether the caller may do something
      description: |
        Forwards a `SelfSubjectAccessReview` using the caller's own token. This
        is how the deploy form greys out actions before submitting — prefer it
        over attempting the write and handling the failure.

        SSAR grants nothing: it reports the caller's own access, and the
        cluster's authorizer decides. What is bounded is the **shape and the
        rate** of the question, because each one becomes a real call to the
        apiserver (issue #73):

        - `verb` must be one kubeport itself performs — see the enum on
          `SSARRequest`. `deletecollection` is in it because that is what
          release deletion actually needs, and k8s authorizes it under its own
          verb rather than under `delete`.
        - `(group, resource)` must be one of the MVP resources kubeport
          applies. Asking about anything else is a 400 whose `detail` **lists
          the allowed set**, so the rule is learnable without guessing.
        - Over budget is a 429 with `Retry-After`. The budget is shared with the
          two cluster-openapi read routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSARRequest" }
      responses:
        "200":
          description: The cluster's verdict.
          content:
            application/json:
              schema:
                type: object
                required: [allowed, denied, reason]
                properties:
                  allowed: { type: boolean }
                  denied: { type: boolean }
                  reason:
                    type: string
                    description: |
                      **Do not branch on this.** It is populated only for
                      kubeport admins on non-demo accounts, and is the empty
                      string for everyone else — including demo accounts, which
                      hold `kubeport-admin` for UX reasons (issue #102).

                      When present it is the cluster authorizer's own sentence,
                      which names the ClusterRoleBinding, ClusterRole and User
                      involved. SSAR is open to any authenticated caller and
                      reports only that caller's own access, so nothing is
                      escalated by it; what leaked was the cluster's binding
                      layout, one namespace at a time.

                      Act on `allowed` / `denied` instead.
        "400":
          description: |
            Body malformed, a required field missing, or `verb` /
            `(group, resource)` outside the allowed sets — `detail` names the
            set in the latter two cases.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No cluster is registered under that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      description: |
        Each row carries `current_ui_spec`, so one call is enough to render a
        deploy form — no follow-up per template.

        **Not paginated** (issue #58): the whole table is returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateListItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template and its first version
      description: |
        `authoring_mode` decides which body fields are read: `yaml` uses
        `resources_yaml` + `ui_spec_yaml`, `ui` uses `ui_state`. The first
        version is created as a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/Template" }
                  version: { $ref: "#/components/schemas/TemplateVersion" }
                  resources_yaml: { type: string }
                  ui_spec_yaml: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A template with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/preview:
    post:
      tags: [templates]
      operationId: previewTemplate
      summary: Convert UI-mode state to YAML without saving
      description: |
        Pure transform of the posted ui_state — reads no template, cluster or
        database — so it is open to any authenticated caller.

        400 when the ui_state would build a document far larger than the body
        that described it. Three limits, all per request: at most 8192 objects
        created, nothing more than 128 levels deep counting a field's path and
        its value together, and at most 1MiB of resources.yaml emitted. Real
        manifest paths run about nine deep and no template approaches any of
        them; a request that trips one is malformed rather than large
        (issue #135).

        Rate limited on a budget shared with the other routes that serialize a
        ui_state, separate from the control-plane routes, and sized for the
        editor's own typing rather than for apiserver fan-out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ui_state]
              properties:
                ui_state: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources_yaml: { type: string }
                  ui_spec_yaml: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/render:
    post:
      tags: [templates]
      operationId: renderTemplate
      summary: Render a template with values, without deploying
      description: |
        The dry run to do before `POST /v1/releases`: same substitution, nothing
        written and nothing sent to a cluster.

        Rendering an unpublished draft is authoring, not catalog browsing: it is
        refused with 403 unless the caller owns the template (kubeport-admin for
        a global template, a member of the owning team otherwise). Published and
        deprecated versions are readable by any authenticated caller.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - name: version
          in: query
          required: false
          description: Defaults to the template's current published version.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { type: string }
                  version: { type: integer }
                  rendered_yaml: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}:
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Get one template
      parameters: [{ $ref: "#/components/parameters/TemplateName" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [templates]
      operationId: updateTemplate
      summary: Edit template metadata
      description: Only the fields present in the body are changed.
      parameters: [{ $ref: "#/components/parameters/TemplateName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                description: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/versions:
    get:
      tags: [templates]
      operationId: listTemplateVersions
      summary: List versions, newest first
      parameters: [{ $ref: "#/components/parameters/TemplateName" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [templates]
      operationId: createTemplateVersion
      summary: Add a draft version
      parameters: [{ $ref: "#/components/parameters/TemplateName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "201":
          description: Created as a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A version with that number already exists for this template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/versions/{v}:
    get:
      tags: [templates]
      operationId: getTemplateVersion
      summary: Get one version
      description: |
        Published and deprecated versions are catalog content that any
        authenticated caller may read. A draft is unreleased authoring state —
        the whole `resources.yaml`, Secrets included — so it is refused with 403
        unless the caller owns the template (kubeport-admin for a global
        template, a member of the owning team otherwise).
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [templates]
      operationId: updateTemplateVersion
      summary: Edit a draft version
      description: |
        Drafts only. A published or deprecated version is immutable — releases
        are pinned to it.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVersionRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The version is not a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [templates]
      operationId: deleteTemplateVersion
      summary: Delete a draft version
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "204": { description: "Deleted. No body." }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The version is not a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/versions/{v}/publish:
    post:
      tags: [templates]
      operationId: publishTemplateVersion
      summary: Publish a draft
      description: |
        Makes this the template's current version. Existing releases stay pinned
        to the version they were deployed from.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The version is not in the state this transition requires; `detail`
            names the state it is actually in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/versions/{v}/deprecate:
    post:
      tags: [templates]
      operationId: deprecateTemplateVersion
      summary: Deprecate a published version
      description: Hides it from the catalog. Running releases are untouched.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: Deprecated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The version is not in the state this transition requires; `detail`
            names the state it is actually in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/templates/{name}/versions/{v}/undeprecate:
    post:
      tags: [templates]
      operationId: undeprecateTemplateVersion
      summary: Undo a deprecation
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The version is not in the state this transition requires; `detail`
            names the state it is actually in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/releases:
    get:
      tags: [releases]
      operationId: listReleases
      summary: List the caller's releases
      description: |
        Admins see every release; everyone else sees their own.

        **No status field and no total count.** Status is derived per release by
        querying the cluster, so it only appears on `GET /v1/releases/{id}` —
        polling a list of N releases costs N cluster round-trips (issues #57,
        #58). There is also no `total`, so "is there another page" has to be
        inferred from a full page.
      parameters:
        - name: limit
          in: query
          description: |
            1–200, default 50. Out-of-range and non-numeric values are ignored
            in favour of the default rather than rejected, so the response
            cannot confirm what was applied (#58).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items: { $ref: "#/components/schemas/ReleaseListItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [releases]
      operationId: createRelease
      summary: Deploy a template version
      description: |
        Renders the template with `values` and applies it with the caller's
        token. A 201 means the apply was accepted; readiness is not waited for,
        so poll `GET /v1/releases/{id}` for status.

        Call `POST /v1/templates/{name}/render` first to check the values, and
        `POST /v1/selfsubjectaccessreview` to check permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReleaseRequest" }
      responses:
        "201":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400":
          description: |
            The body failed validation, or the target version is deprecated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            No such template version, or no such cluster — `detail` says which.
            This is what a mistyped `template` or `cluster` returns.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            Either a release of that name already exists in the cluster and
            namespace, **or the target version is not published**
            (`detail: version not published`). Retrying with a different name
            will not fix the second one, so read `detail` before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          description: |
            The apply failed at the cluster. **A permission denial arrives here,
            not as a 403** — the apiserver's rejection is surfaced as
            `k8s-error`, so do not treat 502 as purely transient and retry it
            blindly.

            kubeport applies no demo restriction of its own to this endpoint:
            demo isolation rests entirely on the target cluster's RBAC
            (`deploy/helm/kubeport/templates/demo-rbac.yaml`). Register a
            cluster without those bindings and there is no application-level
            guard behind them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/releases/{id}:
    get:
      tags: [releases]
      operationId: getRelease
      summary: Release detail with live status
      description: |
        `status` is computed at request time from the cluster, not stored, so
        two calls can disagree without anything having been written. See the
        `status` enum for what each value means.
      parameters: [{ $ref: "#/components/parameters/ReleaseID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [releases]
      operationId: updateRelease
      summary: Move a release to another version and/or values
      description: |
        The target version has to be deployable, the same gate `POST
        /v1/releases` applies: a deprecated version is refused with 400, and a
        draft — one that was never published, or was published and rolled back —
        with 409.
      parameters: [{ $ref: "#/components/parameters/ReleaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, values]
              properties:
                version: { type: integer, minimum: 1 }
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The target version is not published, so it cannot back a release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [releases]
      operationId: deleteRelease
      summary: Delete a release
      parameters:
        - $ref: "#/components/parameters/ReleaseID"
        - name: force
          in: query
          description: |
            Admin only. Skips the cluster entirely and removes just the database
            row. For releases whose cluster is gone or whose objects were
            deleted outside kubeport, where an ordinary delete cannot succeed.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  force: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/releases/{id}/logs:
    get:
      tags: [releases]
      operationId: streamReleaseLogs
      summary: Follow pod logs (Server-Sent Events)
      description: |
        Long-lived `text/event-stream`. Event types:

        | event | data |
        |---|---|
        | `log`   | `{"time": <unix ms>, "pod": "<name>", "text": "<line>"}`. `time` is when the container wrote the line, from the kubelet's own stamp — not when the server forwarded it (#131); replayed history carries past times, and under `instance=all` frame order and `time` order can differ, so do not read `time` as progress. **On a named-instance stream**, a stamped line also carries an SSE `id:` — the same instant, always UTC with exactly nine fractional digits (`2026-09-09T07:36:36.120000000Z`), so ids sort as strings in time order. That is the resume point below |
        | `ping`  | unix seconds, every 15s to keep the connection open |
        | `error` | a `Problem`, same schema and same `ErrorKind` vocabulary as any other error. `title` is `rbac-denied` (403, the caller may read the release but not its pods' logs — permanent), `cluster-auth-denied` (502, the cluster refused the forwarded token — permanent), or `k8s-error` (502, transport or anything else — retryable) |
        | `end`   | `{"reason": "all pods stopped emitting"}` — a fixed string. The stream is over; the server closes immediately after. Always the last frame a client receives |

        Authentication failures before the stream opens are ordinary JSON
        Problems; once it is open, failures arrive as `error` events — and
        since #82 the two are the same shape, so one parser covers both. A
        cluster call that fails while listing the release's pods — before the
        handshake — carries the same three kinds as the table above rather than
        collapsing into `k8s-error`: the handshake is not supposed to change
        what a failure is called, and a client that gates a retry on the kind
        was being told a permanent refusal was worth retrying (#134). The
        frame carries `request_id`, which is the only way to reach the reason:
        `detail` is deliberately generic because client-go's text names the
        apiserver's address, the namespace and the pod, and this frame is
        rendered verbatim in the log pane (#108).

        An `error` frame does not by itself mean the stream is over — with
        `instance=all` the handler keeps following the healthy pods after
        writing one. The stream ends when every pod has stopped emitting, and
        the `end` frame is what says so. Errors buffered at that moment are
        flushed first — they used to race the close and were dropped about half
        the time.

        **Treat `end` as the signal to stop, not the connection closing.**
        Nothing else distinguishes a finished stream from a dropped one:
        WHATWG gives `EventSource` no way to tell them apart, so a client that
        waits for the close instead reconnects on the browser's own 3s timer,
        indefinitely (#162) — and on an `instance=all` stream, which has no
        resume point (below), is served the whole container log every time.
        Close the connection yourself when `end` arrives.

        A connection that closes **without** `end` was dropped, not finished,
        and reopening is the right response. The only paths that omit the frame
        are the ones where the client has already gone, so its absence never
        means "finished, quietly".

        **Reopening resumes rather than replays — when following one instance.**
        On a single-instance stream each `log` frame carries an SSE `id:`, so a
        standard `EventSource` sends the last one back as `Last-Event-ID` on its
        automatic reconnect and picks up where it left off: no client code, and
        no duplicates in a pane the browser does not clear (#107). A caller with
        no `EventSource` keeping track for it can pass the same instant as
        `?since=`, which wins if both are present.

        **`instance=all` emits no ids and ignores a resume point**, so it
        replays from the beginning as it always did — including when it happens
        to match a single pod, because which pods it covers is not fixed. One
        instant cannot stand for progress through a set: pods are followed
        concurrently and merged without ordering, so the newest id belongs to
        whichever wrote last, and resuming every pod from it would skip —
        silently and for good — whatever a slower one had not reached. Nor can
        it survive the set changing: a single-replica release that rolls over
        would hand the cursor of the pod that left to the pod that replaced it.
        Resending lines is the lesser cost. A per-pod cursor is tracked as #172.

        Naming an instance is what makes a stream resumable, because the name is
        in the request: it means the same pod on every reconnect, and if that pod
        is gone the answer is `404 no-pods` rather than a different pod
        inheriting its position.

        A line the kubelet could not stamp carries no id either. Its `time` is
        the server's clock so the row has something to render, and letting that
        into the cursor would claim the client had read up to *now*.

        The cluster's own filter is whole seconds, so it returns everything
        from the second you asked about; the server trims that overlap against
        the exact instant before sending, so a resume is duplicate-free without
        the caller deduplicating. A line the kubelet could not stamp is always
        sent — a possible duplicate beats a line that silently disappears.

        Sending no resume point gets the container log from the beginning,
        which is what a first open wants and what the Reconnect button in the
        web UI does, since it empties the pane at the same time.

        `reason` is human-readable text, not a branch key — it carries no closed
        vocabulary and may be reworded, and like an `error` frame's `detail` it
        must never carry the cluster's own words (#108). When a stream ended
        because of a failure, the thing to branch on is the `title` of the
        preceding `error` frame. If `reason` ever needs to vary by meaning, give
        it an enum beside `ErrorKind` with the same build-time guard rather than
        changing this prose.

        `end` is additive: a client that registers no listener for it never sees
        the frame — `onmessage` receives only unnamed events — and behaves
        exactly as it did before, so nothing that worked breaks. Parsers that
        render every `data:` line verbatim will print the payload, so branch on
        the event name rather than on the payload.

        This endpoint has no way to tell a client that a *pod* is done while
        others continue; `end` is about the whole stream.

        **A stream is also ended by the server after a fixed lifetime** — one
        hour by default, which an install can change — and that ending sends
        **no** `end` frame, because it is not a finish (#169). Nothing else
        would ever close a stream the reader keeps open, and the stream does
        not re-check its caller after the handshake, so without this a revoked
        permission or an expired session went on receiving logs for as long as
        the tab stayed open. Treat it like any drop: reconnect. A browser does
        so on its own, through a refreshed token and a new authorization; a
        named instance resumes from its cursor and `instance=all` replays.

        A caller may also hold only so many streams open at once (16 by
        default, which an install can change); past that, opening another is
        `429 too-many-streams` — see the `RateLimited` response.
      parameters:
        - $ref: "#/components/parameters/ReleaseID"
        - name: instance
          in: query
          description: Pod name, or `all` (default) to follow every pod.
          schema: { type: string, default: all }
        - name: since
          in: query
          required: false
          description: |
            Resume point: an RFC3339 instant, normally the `id:` of the last
            `log` frame received. Lines at or before it are not sent. Omit to
            get the container log from the beginning.

            A browser does not need this — its `EventSource` sends
            `Last-Event-ID` by itself. This parameter is for callers that do
            not, and it takes precedence over that header when both are given.

            **Requires a named `instance`.** With `instance=all` — the default —
            an explicit `since` is `400 validation-error` rather than silently
            ignored: a 200 carrying the whole log would look like a working
            resume while every reconnect duplicated. (`Last-Event-ID` on an
            `all` stream is still ignored, not refused — the browser keeps it
            across an instance switch.) See the description above for why `all`
            cannot resume.

            An unparseable `since` is `400 validation-error`: the caller wrote
            it, and a 200 with the whole log would let them keep sending it.
            An unparseable `Last-Event-ID` is **not** an error — it starts the
            stream from the beginning instead. No caller typed that value; the
            browser re-attaches it on every automatic reconnect and nothing on
            the page can clear it, so refusing it would leave the tab with a log
            pane that fails on every reconnect until reloaded.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Stream opened.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No such release, or no pod matched `instance` — `title` is
            `not-found` or `no-pods`. `no-pods` is an observation, not a
            verdict: a pod that is still Pending or pulling, and a Job between
            runs, both land here, so it is worth retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: Admins see all teams; everyone else sees their own.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: Admin only, refused for demo-domain callers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                display_name: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A team with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/teams/{id}/members:
    get:
      tags: [teams]
      operationId: listTeamMembers
      summary: List team members
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a member
      description: |
        Admin only, refused for demo-domain callers. `editor` may author
        templates the team owns; `viewer` may read them, drafts included.
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [editor, viewer] }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No such team, or no user with that email has ever signed in —
            `title` is `not-found` or `user-not-found`. kubeport cannot invite
            people; they must log in once first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/teams/{id}/members/{user_id}:
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a member
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: "Removed. No body." }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OIDC **id_token** (not an access token) from an issuer this install
        trusts. The backend checks signature, issuer and `aud`, then forwards
        the same token to the target cluster.

        How to obtain one non-interactively is not solved for production IdPs —
        see `docs/machine-clients.md` and issue #34.

  parameters:
    ClusterName:
      name: name
      in: path
      required: true
      description: The cluster's registered `name`, not its UUID.
      schema: { type: string }
    TemplateName:
      name: name
      in: path
      required: true
      schema: { type: string }
    VersionNumber:
      name: v
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReleaseID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: |
        Echoed on **every** response, and equal to `Problem.request_id` on an
        error. An inbound `X-Request-Id` matching `^[A-Za-z0-9._-]{1,64}$` is
        adopted, so a caller's own id survives the BFF hop; anything else is
        replaced with a generated one.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"

  responses:
    Unauthenticated:
      description: |
        Missing, malformed or rejected token. Through the BFF this also covers a
        missing or expired session cookie.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://kubeport.io/errors/unauthenticated
            title: unauthenticated
            status: 401
            detail: missing bearer token
            request_id: 4d3f0a2c-7c1e-4a6b-9f10-2f5f1f0b8e21
    Forbidden:
      description: |
        `title` says who refused: `rbac-denied` is kubeport's own check or the
        cluster's RBAC; `demo-restricted` is a demo account hitting a write that
        demo accounts never get.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: The request body or a parameter did not validate.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: |
        Over the per-caller budget (`rate-limited`). The budget is a token
        bucket keyed by OIDC subject, in-process and per replica — it exists to
        bound how often a caller can make kubeport talk to a cluster's control
        plane, not to price the API (issue #73).

        `Retry-After` says how many seconds to wait; honour it rather than
        retrying at once or sleeping an arbitrary constant. The demo's two Dex
        accounts are static, so concurrent demo visitors share one bucket.

        `too-many-streams` is the other 429, and only
        `GET /v1/releases/{id}/logs` gives it: the caller already holds as many
        log streams **open** as it may (#169). The bucket above prices opening a
        stream and nothing after, so it cannot bound how many a caller keeps —
        and each keeps a goroutine per pod and an apiserver connection alive.
        Branch on `title`: this one clears when one of the caller's streams
        closes, not after a set time, so close a stream you no longer need
        rather than only backing off. `Retry-After` is still present, as a
        backoff hint rather than a prediction, and the `X-RateLimit-*` pair is
        **not** — it describes the per-minute budget and would be wrong about a
        count of open streams. The cap is per caller, so the demo's shared
        accounts share it too.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Always present on a 429.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Requests allowed per minute for this caller.
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: Always `0` here — the header is emitted only on refusal.
          schema: { type: integer }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: |
        The call to the target cluster failed or was refused (`k8s-error`). An
        RBAC denial from the apiserver arrives here rather than as a 403, so
        this is not automatically a transient condition — check `detail` before
        retrying.

        `detail` is the apiserver's own words **only when the apiserver
        answered** — a Forbidden, Invalid, NotFound, AlreadyExists, Conflict or
        Unauthorized verdict. `User "x" cannot create deployments` is why the
        deploy failed and belongs on screen. When the call never got there, the
        transport error names the cluster's internal address, so it goes to the
        log and `detail` is only the operation that failed (issue #49).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    MethodNotAllowed:
      description: |
        The path exists but does not accept this method (`method-not-allowed`).

        **`Allow` is the actionable part** — it lists the verbs this path does
        accept, so a client can correct itself rather than concluding the
        resource is gone. That conclusion is exactly what the old behaviour
        produced: gin folds a wrong verb into its 404 unless
        `HandleMethodNotAllowed` is set, and it was not (issue #81).

        Every path in this document can answer 405; it is written by the
        router's fallback rather than by any operation, so it is not repeated
        under each one. It is also answered before the auth gate — see
        "Every error is a Problem".
      headers:
        Allow:
          description: "Comma-separated verbs this path accepts, e.g. `GET, POST`."
          schema: { type: string }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    ClusterOpenAPIUpstream:
      description: |
        The cluster's OpenAPI endpoint failed or refused the request. Branch on
        `title`:

        | `title` | meaning | retry? |
        |---|---|---|
        | `cluster-auth-denied` | the cluster rejected the token kubeport forwarded (its 401 or 403) | no — the caller's access to *that cluster* has to change |
        | `k8s-error` | the call failed, or the cluster refused it for another reason | maybe — transient for a transport failure, not for a refusal |

        `cluster-auth-denied` exists because the upstream 401 used to be passed
        through, and a client cannot tell "kubeport does not know you" from
        "the cluster does not know you" by status alone. The first is fixed by
        signing in again; the second never is (issue #83).

        `detail` is kubeport's own sentence in both cases — the cluster's
        response body can name its internals, so it goes to the server log with
        the request id.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: |
        Something failed on kubeport's side. `title` is `internal` for a
        database, rendering or k8s-client-construction failure, or
        `cluster-config` when the stored registration's TLS material is not
        usable.

        **`detail` no longer carries the underlying error** (issue #49). A pgx
        connect failure spelled out `host=… user=… database=…`, and a k8s
        transport failure carried the apiserver's address — the same value
        `GET /v1/clusters` deliberately withholds (#52). The reason is in the
        server log; quote `request_id` to have it looked up.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: |
        RFC 7807-shaped. Every error this API and the BFF *route* uses it —
        branch on `title`, the stable machine-readable kind; `detail` is prose
        and may change.

        Two caveats worth knowing before you write a parser:

        - It is served as `application/json`, not `application/problem+json`
          (`errors.go` uses gin's `AbortWithStatusJSON`). A strict RFC 7807
          client that content-negotiates on the media type will not match.
        - There is no non-JSON error left to handle. A path matching no route
          is `404 not-found`, a wrong verb is `405 method-not-allowed`, and a
          panic is `500 internal` — all in this schema. Until #81 the first two
          were gin's `text/plain` defaults and the third had no body at all, so
          a parser written before that needed a content-type fallback. It does
          not any more. See "Every error is a Problem" above.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: "`https://kubeport.io/errors/<title>`. Not dereferenceable."
        title: { $ref: "#/components/schemas/ErrorKind" }
        status: { type: integer }
        detail: { type: string }
        request_id:
          type: string
          description: |
            Present on every 4xx and 5xx, and equal to the `X-Request-Id`
            response header. Quote it when reporting a failure: a 500 keeps its
            reason in the server log rather than the body, and this is what ties
            the two together.

            An inbound `X-Request-Id` is adopted when it matches
            `^[A-Za-z0-9._-]{1,64}$`, so a caller's own trace survives the BFF
            hop; anything else is replaced. The charset is enforced because
            header values may contain spaces and `=`, which would let a crafted
            id forge fields inside the access-log line.

    ErrorKind:
      type: string
      description: |
        The closed set of error kinds. `openapi_spec_test.go` fails the build if
        this list and the kinds the handlers emit fall out of step, in either
        direction.
      enum:
        - unauthenticated   # 401 — no/invalid token or session
        - rbac-denied       # 403 — kubeport's own check refused
        - demo-restricted   # 403 — demo account, write not available
        - validation-error  # 400 — body or parameter rejected
        - not-found         # 404 — no such object, and also the router's own
                            # fallback for a path that matches no route (#81)
        - user-not-found    # 404 — email has never signed in
        - no-pods           # 404 — release has no pod matching ?instance
        - method-not-allowed # 405 — the path exists, the verb does not. Gin
                            # folded this into 404 until #81; an agent reading
                            # "not found" concluded the resource was gone.
        - conflict          # 409 — name taken, or version in the wrong state
        - rate-limited      # 429 — over the per-caller budget on the SSAR and
                            # cluster-openapi routes. Carries Retry-After.
        - too-many-streams  # 429 — the caller already holds as many log
                            # streams open as it may (#169). Clears when one of
                            # them closes, not with time. Carries Retry-After as
                            # a backoff hint and no X-RateLimit-* pair.
        - k8s-error        # 502 — the call to the cluster failed or was
                            # refused. No longer a 500: a client that could not
                            # be built at all is now `internal`, because the
                            # reason named the apiserver's address (#49).
                            # Also appears with 404 on the cluster-openapi
                            # routes, where an unknown group/version is the
                            # apiserver answering the question that was asked.
                            # Carried by the SSE `error` frame as well.
        - cluster-auth-denied # 502 — the *cluster* refused the token kubeport
                            # forwarded. Its own kind because passing the
                            # upstream 401 through said "your kubeport session
                            # is bad" and sent clients into a re-login loop
                            # (#83). Retrying without changing the cluster's
                            # RBAC will not help.
        - cluster-config    # 500 — stored registration unusable; `detail` says
                            # to check the cluster's ca_bundle, and the reason
                            # is in the server log rather than the body
        - internal          # 500 — reason withheld; quote `request_id`

    ClusterSummary:
      type: object
      description: What GET /v1/clusters returns. Connection fields are omitted.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: [string, "null"] }
        default_namespace: { type: [string, "null"] }

    Cluster:
      allOf:
        - $ref: "#/components/schemas/ClusterSummary"
        - type: object
          description: Full record, returned only by POST /v1/clusters.
          properties:
            api_url: { type: string, format: uri }
            ca_bundle:
              type: [string, "null"]
              description: |
                PEM text, not base64. Null only on a cluster registered before
                validation existed, or with `KBP_DEV_ALLOW_INSECURE_CLUSTERS`.
            oidc_issuer_url: { type: string, format: uri }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    CreateClusterRequest:
      type: object
      # ca_bundle is listed as required because the endpoint refuses without
      # it. The one exception is a backend running with
      # KBP_DEV_ALLOW_INSECURE_CLUSTERS=true, which is local dev only.
      required: [name, api_url, ca_bundle, oidc_issuer_url]
      properties:
        name:
          type: string
          minLength: 1
          description: Slug releases refer to. Must be unique.
        display_name: { type: string }
        api_url:
          type: string
          format: uri
          description: For an in-cluster target, `https://kubernetes.default.svc`.
        ca_bundle:
          type: string
          description: |
            PEM text, not base64. **Required**, and validated here: an empty or
            unparseable bundle is a 400 (issue #96).

            It used to be optional, and omitting it made the backend connect
            with TLS verification disabled while still returning 201 — on the
            very path that forwards the user's id_token to the apiserver. It now
            fails at registration rather than at the first deploy, where the
            reason reached only the pod log and the UI reported "cluster
            unreachable", pointing the operator at the network.

            `KBP_DEV_ALLOW_INSECURE_CLUSTERS=true` on the backend restores the
            old behaviour for a local kind cluster. Local dev only.
        oidc_issuer_url: { type: string, format: uri }
        default_namespace:
          type: string
          description: Pre-selected in the deploy form.

    SSARRequest:
      type: object
      description: |
        `verb` and `(group, resource)` are constrained to what kubeport itself
        performs — see the endpoint description. A rejected request's `detail`
        lists the set it violated.
      required: [cluster, verb, resource]
      properties:
        cluster: { type: string }
        namespace:
          type: string
          description: Empty checks cluster scope.
        verb:
          type: string
          description: |
            `deletecollection` is what release deletion needs; k8s authorizes
            it under that verb, not under `delete`.
          enum:
            - create
            - update
            - patch
            - delete
            - deletecollection
            - get
            - list
            - watch
          example: create
        group:
          type: string
          description: |
            Empty for core resources. The pair `(group, resource)` must be one
            of the MVP set: `configmaps`, `persistentvolumeclaims`, `secrets`,
            `services`, `apps/daemonsets`, `apps/deployments`,
            `apps/statefulsets`, `batch/cronjobs`, `batch/jobs`,
            `networking.k8s.io/ingresses`.
          example: apps
        resource:
          type: string
          example: deployments
        name:
          type: string
          description: Empty checks the whole collection.

    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        description: { type: [string, "null"] }
        tags:
          type: array
          items: { type: string }
        owner_user_id: { type: string, format: uuid }
        current_version_id: { type: [string, "null"], format: uuid }
        owning_team_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/Template"
        - type: object
          properties:
            current_version: { type: [integer, "null"] }
            owning_team_name: { type: [string, "null"] }

    TemplateListItem:
      allOf:
        - $ref: "#/components/schemas/Template"
        - type: object
          properties:
            current_version: { type: [integer, "null"] }
            current_ui_spec:
              type: [string, "null"]
              contentMediaType: application/yaml
              contentSchema: { $ref: "#/components/schemas/UiSpec" }
              description: |
                The published version's ui-spec YAML. Present so a client can
                build a deploy form from the list alone — parse it as the
                UiSpec schema below.
            current_status:
              type: [string, "null"]
              description: null when the template has no version yet.
              enum: [draft, published, deprecated, null]

    TemplateVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        version: { type: integer }
        resources_yaml: { type: string }
        ui_spec_yaml:
          type: string
          contentMediaType: application/yaml
          contentSchema: { $ref: "#/components/schemas/UiSpec" }
        metadata_yaml: { type: [string, "null"] }
        status:
          type: string
          enum: [draft, published, deprecated]
        notes: { type: [string, "null"] }
        authoring_mode:
          type: string
          enum: [yaml, ui]
        ui_state_json:
          type: [object, "null"]
          additionalProperties: true
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }

    CreateTemplateRequest:
      type: object
      required: [name, display_name, authoring_mode]
      properties:
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        authoring_mode:
          type: string
          enum: [yaml, ui]
        owning_team_id:
          type: string
          description: |
            UUID, or empty for a global template. Publishing a global template
            is admin-only.
        resources_yaml:
          type: string
          description: Read when authoring_mode is `yaml`.
        ui_spec_yaml:
          type: string
          description: Read when authoring_mode is `yaml`.
        ui_state:
          type: object
          additionalProperties: true
          description: Read when authoring_mode is `ui`.
        metadata_yaml: { type: string }

    CreateVersionRequest:
      type: object
      required: [authoring_mode]
      properties:
        authoring_mode:
          type: string
          enum: [yaml, ui]
        resources_yaml: { type: string }
        ui_spec_yaml:
          type: string
          contentMediaType: application/yaml
          contentSchema: { $ref: "#/components/schemas/UiSpec" }
        ui_state:
          type: object
          additionalProperties: true
        metadata_yaml: { type: string }
        notes: { type: string }

    UpdateVersionRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        resources_yaml: { type: string }
        ui_spec_yaml:
          type: string
          contentMediaType: application/yaml
          contentSchema: { $ref: "#/components/schemas/UiSpec" }
        ui_state:
          type: object
          additionalProperties: true
        metadata_yaml: { type: string }
        notes: { type: string }

    UiSpec:
      type: object
      description: |
        What the YAML in `current_ui_spec` / `ui_spec_yaml` parses to. This is
        the contract for building a deploy form and for keying `values`.

        A `path` selects a node in the template's resources.yaml:

            <Kind>[<selector>].<field>(.<field>|[<index>])*

        `<selector>` is a list index or a metadata.name, and may be omitted when
        only one object of that Kind exists. Examples:
        `Deployment.spec.replicas`,
        `Service[web].spec.ports[0].port`,
        `Deployment[api].spec.template.spec.containers[0].image`.

        Grammar:

            <Kind>[<selector>] ( "." ? <segment> )*
            <segment> ::= NAME | "[" INT "]" | "[" QUOTED "]"
            NAME      ::= [A-Za-z_][A-Za-z0-9_]*
            QUOTED    ::= '"' [^"]* '"' | "'" [^']* "'"

        NAME cannot hold `.`, `-` or `/`, all of which are legal in a
        Kubernetes key. Widening it would not help: `.` separates segments, so
        `metadata.labels.app.kubernetes.io/name` is ambiguous between one key
        and four. A key that NAME cannot spell — a label, an annotation, a
        ConfigMap data filename — goes in a quoted segment, which is ONE key
        despite the dots inside it:
        `Deployment[web].metadata.labels["app.kubernetes.io/name"]`,
        `ConfigMap[conf].data["nginx.conf"]`.

        There is exactly one spelling per path, and a path written any other
        way is rejected with the corrected form in the error:

          - quote only what NAME cannot spell. `spec["replicas"]` names the
            same node as `spec.replicas` and is refused.
          - use `"`. There is no escape character, so a key containing `"` is
            the one case written with `'` instead — and a key containing both
            cannot be addressed at all.

        A path is checked when the template is written (400), not when a
        release is deployed, so `path` is safe to treat as valid once
        `POST /v1/templates` has accepted it.
      properties:
        fields:
          type: array
          items:
            type: object
            required: [path, label, type]
            properties:
              path:
                type: string
                description: Also the key to use in a release's `values`.
              label: { type: string }
              help: { type: string }
              type:
                type: string
                enum: [string, integer, boolean, enum, autocomplete]
              min: { type: integer }
              max: { type: integer }
              pattern:
                type: string
                description: Go RE2 syntax.
              values:
                type: array
                items: { type: string }
                description: |
                  Allowed values for `enum`. For `autocomplete` these are
                  suggestions only and are not enforced.
              default: {}
              required: { type: boolean }

    CreateReleaseRequest:
      type: object
      required: [template, version, cluster, namespace, name, values]
      properties:
        template: { type: string }
        version: { type: integer, minimum: 1 }
        cluster:
          type: string
          description: A registered cluster's `name`.
        namespace: { type: string }
        name:
          type: string
          description: RFC 1123 hostname. Unique within cluster + namespace.
        values:
          type: object
          additionalProperties: true
          description: |
            A **flat** object — not nested — whose keys are the ui-spec's
            `fields[].path` strings verbatim. See the UiSpec schema.
          example:
            Deployment.spec.replicas: 2
            Deployment.spec.template.spec.containers[0].image: nginx:1.27

    Release:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        template_version_id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        namespace: { type: string }
        values_json:
          type: object
          additionalProperties: true
        rendered_yaml: { type: string }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReleaseListItem:
      type: object
      description: No status — see GET /v1/releases.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        template_version_id: { type: string, format: uuid }
        template_name: { type: string }
        template_version: { type: integer }
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        namespace: { type: string }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReleaseDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        template:
          type: object
          properties:
            name: { type: string }
            version: { type: integer }
        cluster: { type: string }
        namespace: { type: string }
        values_json:
          type: object
          additionalProperties: true
        rendered_yaml: { type: string }
        instances_total: { type: integer }
        instances_ready: { type: integer }
        instances:
          type: array
          items: { $ref: "#/components/schemas/Instance" }
        status: { $ref: "#/components/schemas/ReleaseStatus" }
        created_at: { type: string, format: date-time }

    ReleaseStatus:
      type: string
      description: |
        Derived per request from the cluster; never stored, so there is no
        terminal value to wait for and no transition to subscribe to. A
        background reconciler that would make this durable is deferred
        (Plan 12).
      enum:
        - healthy              # every instance ready
        - warning              # some instance not ready yet
        - error                # an instance Failed, or restarted more than 5 times
        - unknown              # no instances found, cause undetermined
        - cluster-unreachable  # the cluster did not answer — says nothing about the workload
        - resources-missing    # cluster answered, objects are gone (deleted outside kubeport)

    Instance:
      type: object
      description: One pod.
      properties:
        name: { type: string }
        phase:
          type: string
          example: Running
        ready: { type: boolean }
        restarts: { type: integer }

    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    TeamMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        role:
          type: string
          enum: [editor, viewer]
        created_at: { type: string, format: date-time }
