services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kubeport
      POSTGRES_PASSWORD: kubeport
      POSTGRES_DB: kubeport
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeport -d kubeport"]
      interval: 5s
      timeout: 3s
      retries: 10

  dex:
    image: dexidp/dex:v2.39.0
    command: ["dex", "serve", "/config/dex.yaml"]
    # Loopback by default, like postgres above (#63). dex.yaml's static
    # passwords are in this public repo, so publishing on every interface let
    # anyone on the same Wi-Fi or office network sign in and get a valid
    # id_token for as long as a local backend trusts this issuer.
    #
    # Who reaches it: host processes (backend, BFF, go test, ci.yml's backend
    # job) use host.docker.internal -> 127.0.0.1, so loopback is enough. So is
    # a kind cluster on Docker Desktop (Windows/macOS), which forwards
    # host.docker.internal to the host's loopback. A kind apiserver on native
    # Linux docker — and CI's playwright.yml — comes in through the docker
    # network gateway instead, which a loopback publish does not answer; those
    # set KBP_DEX_BIND=0.0.0.0 (docs/local-e2e.md §4).
    ports: ["${KBP_DEX_BIND:-127.0.0.1}:5556:5556"]
    volumes:
      - ./dex.yaml:/config/dex.yaml:ro
      - ./certs:/config/certs:ro
    # Probes the plaintext telemetry listener (dex.yaml `telemetry.http`), not the
    # HTTPS port: the image ships BusyBox wget, which has no --no-check-certificate,
    # so it cannot talk to dex's self-signed cert on 5556.
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget resolves localhost to ::1 first and
      # dex's telemetry listener is IPv4-only, which fails with "Connection refused".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5558/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
