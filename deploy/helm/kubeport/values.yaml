# Default values for kubeport. Override per environment via -f or --set.
#
# Two install patterns:
#   1. Embedded Postgres + chart-managed Secret (dev / Phase 1):
#        auth.create=true, postgres.embedded=true
#        Set auth.appEncryptionKeyB64, auth.oidcClientSecret, postgres.password.
#        NEVER commit a values file with real secret values.
#   2. External Secret + external Postgres (prod-grade):
#        auth.create=false, auth.existingSecret=<name>
#        postgres.embedded=false, postgres.externalUrl=<postgres URL>

nameOverride: ""
fullnameOverride: ""

# ----- Images -------------------------------------------------------------
images:
  backend:
    repository: ghcr.io/shyuni4u/kubeport-backend
    tag: ""           # empty = use Chart.appVersion
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/shyuni4u/kubeport-frontend
    tag: ""           # empty = use Chart.appVersion
    pullPolicy: IfNotPresent

imagePullSecrets: []  # e.g. [{ name: ghcr-pull-secret }] when using private packages

# ----- Public-facing host -------------------------------------------------
host: kubeport.example.com  # override per environment

# ----- OIDC (issuer + client) --------------------------------------------
# kubeport delegates auth to an external IdP via OIDC. Set issuer to whatever
# IdP you choose (Google: https://accounts.google.com, dex self-hosted, etc.)
oidc:
  issuer: ""          # required — chart fails template render if empty
  # MUST equal the `aud` claim of the IdP's id_token. Google and most IdPs set
  # aud = client_id, so set this to the same value as clientId. Leaving the
  # default with such an IdP makes every login fail token validation (401).
  audience: kubeport
  clientId: ""        # required
  # redirectUri auto-derived from .Values.host if left empty:
  redirectUri: ""
  # OAuth scopes requested at login. Empty = "openid email profile" (works with
  # Google — it rejects an unknown `groups` scope at the consent screen, so leave
  # this empty there). Group-aware IdPs (Dex/Keycloak) can add groups:
  # "openid email profile groups".
  scopes: ""

# ----- Auth secrets -------------------------------------------------------
# Either let the chart create the Secret (auth.create=true) or reference an
# externally managed one (auth.existingSecret). The Secret must contain:
#   APP_ENCRYPTION_KEY_B64, OIDC_CLIENT_SECRET, DATABASE_URL
auth:
  create: true
  existingSecret: ""
  # Used only when create=true. Pass via --set or external values file.
  appEncryptionKeyB64: ""   # 32 bytes, base64 — `openssl rand -base64 32`
  oidcClientSecret: ""
  # Comma-separated emails granted in-app admin when the IdP emits no groups
  # claim (e.g. Google). Bootstrap/demo use only. Empty = no bootstrap admin.
  devAdminEmails: ""

# ----- Backend ------------------------------------------------------------
backend:
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Optional non-secret config
  openapiCacheMax: 64
  # How often expired sessions are deleted (Go duration, e.g. "30m"). Empty
  # uses the built-in default of 1h; anything under 1m is clamped to 1m.
  sessionReapInterval: ""

# ----- Frontend -----------------------------------------------------------
frontend:
  replicaCount: 1
  service:
    port: 3000
  # Public origins this install is served on, e.g.
  # ["https://kubeport.example.com", "https://kp.example.com"]. Login/logout
  # redirects and the logout same-origin check are pinned to this list so a
  # forged X-Forwarded-Host can't steer them. Leave empty for a single domain —
  # the origin of oidc.redirectUri is used then.
  publicOrigins: []
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi

# ----- Postgres -----------------------------------------------------------
postgres:
  embedded: true
  # When embedded=true, chart provisions a single-replica StatefulSet.
  # When embedded=false, set externalUrl to a postgres:// connection string.
  externalUrl: ""
  image: postgres:16-alpine
  user: kubeport
  database: kubeport
  password: ""               # required when embedded=true
  storage:
    size: 10Gi
    storageClassName: ""     # cloud-specific; "" = cluster default
  service:
    port: 5432
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ----- Ingress ------------------------------------------------------------
ingress:
  enabled: true
  className: traefik         # k3s default; GKE = "gce", nginx = "nginx"
  annotations: {}
  # tls handled by .Values.tls below

tls:
  # Setting this to false makes the derived oidc.redirectUri http://, and that
  # URI is also the default public-origin allowlist. So if TLS is terminated
  # outside the cluster (Cloudflare, an external LB) and you set this to false,
  # put the https origin the browser actually sees in frontend.publicOrigins —
  # otherwise logout answers 403 and the post-login redirect downgrades to http.
  enabled: true
  # cert-manager Certificate (recommended)
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  # Or reference a pre-existing TLS Secret (skip cert-manager block above)
  existingSecret: ""

# ----- Migration (atlas schema apply, runs as backend initContainer) -----
migration:
  enabled: true
  # Pin a specific tag — `:latest` would silently shift between deploys and
  # reproducibility matters for migration logic. Bump deliberately.
  image: arigaio/atlas:0.30.0
  # The chart mounts files/schema.hcl + a chart-generated atlas.hcl via the
  # migration ConfigMap. See chart README for the schema sync workflow.

# ----- Pod-level common settings -----------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ----- Dex (optional self-hosted demo IdP) --------------------------------
# Static-password OIDC IdP for a public demo login, alongside the primary
# oidc.* IdP (e.g. Google). Backend accepts tokens from both issuers
# (KBP_OIDC_ISSUERS). See README "Demo mode (Dex)" for setup.
dex:
  enabled: false
  host: ""                       # e.g. dex.kubeport.enzo.kr (required when enabled)
  image: ghcr.io/dexidp/dex:v2.39.0
  clientId: kubeport-demo
  clientSecret: ""                # --set, never commit. Also set via an
                                   # external Secret's DEMO_OIDC_CLIENT_SECRET
                                   # key when auth.create=false.
  # bcrypt hashes: htpasswd -bnBC 10 "" '<pw>' | tr -d ':\n'
  staticPasswords:
    - email: demo-admin@demo.kubeport
      username: demo-admin
      userID: demo-admin-000
      hash: ""
    - email: demo-user@demo.kubeport
      username: demo-user
      userID: demo-user-000
      hash: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ----- Demo mode (namespace + quota + RBAC + reset CronJob) --------------
demo:
  enabled: false
  namespace: demo
  emailDomain: demo.kubeport
  adminEmail: demo-admin@demo.kubeport
  userEmail: demo-user@demo.kubeport
  passwordHint: ""                # shown on landing (public by design)
  # Let demo accounts author new templates. Off by default: demo accounts carry
  # kubeport-admin so they can show the admin UX, and authoring is the one admin
  # power whose output outlives the visit and reaches other people. Their
  # templates are kept out of real users' catalogs either way, but they survive a
  # demo reset once someone deploys from them. Turn on only where demonstrating
  # authoring is the point. See docs/brainstorming-summary.md §14.
  #
  # The reset CronJob does NOT need this: it seeds the catalog through the
  # database, not the API. It did once, and leaving that coupling in place meant
  # a closed gate emptied the live demo every six hours (#104).
  allowTemplateCreate: false
  # Lets the unauthenticated /healthz?verbose=1 (and the BFF's /api/healthz in
  # front of it) report how many templates the catalog holds. Off by default:
  # on a self-hosted install the catalog's size is not the anonymous internet's
  # business. The public demo turns it on so an external cron can tell that a
  # reset wiped and then failed to re-seed — which is otherwise invisible for
  # six hours (#119; #104 was caught only by luck).
  publicHealthCatalog: false
  adminPassword: ""               # --set; used by the reset job only
  userPassword: ""                # --set
  cluster: oci-a1
  resetSchedule: "0 */6 * * *"
  # bitnami/kubectl tags were pulled from Docker Hub (2025); alpine/k8s ships
  # sh + kubectl for amd64/arm64. The init container needs a shell (sh -c).
  kubectlImage: alpine/k8s:1.31.9
  usernamePrefix: "dex:"          # must match k3s AuthenticationConfiguration
  # Pod Security Admission enforce level for the demo namespace.
  # `baseline` blocks privileged/hostPath/hostNetwork while still allowing
  # ordinary user templates; raise to `restricted` for a stricter demo.
  podSecurityEnforce: baseline

nodeSelector: {}
tolerations: []
affinity: {}
