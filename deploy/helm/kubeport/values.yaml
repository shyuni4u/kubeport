# Default values for kubeport. Override per environment via -f or --set.
#
# Two install patterns:
#   1. Embedded Postgres + chart-managed Secret (dev / Phase 1):
#        auth.create=true, postgres.embedded=true
#        Set auth.appEncryptionKeyB64, auth.oidcClientSecret, postgres.password.
#        NEVER commit a values file with real secret values.
#   2. External Secret + external Postgres (prod-grade):
#        auth.create=false, auth.existingSecret=<name>
#        postgres.embedded=false, postgres.externalUrl=<postgres URL>

nameOverride: ""
fullnameOverride: ""

# ----- Images -------------------------------------------------------------
# `latest` is republished on every main commit, and is what makes a no-flags
# `helm install` work — the right default for evaluating the chart, the wrong one
# for running it, because nothing records which commit a given Pod is on.
#
# For anything you intend to keep, pin the immutable per-commit tag instead —
# every main commit publishes one:
#   --set images.backend.tag=sha-<7> --set images.frontend.tag=sha-<7>
# That is what docs/oci-prod-runbook.md §3 does, and it is why rollback works.
#
# Do not put Chart.appVersion here: no semver image tag has ever been published
# (see the note on the image helpers in templates/_helpers.tpl).
#
# pullPolicy is empty on purpose — it is derived from the tag: `latest` gets
# Always, a pinned tag gets IfNotPresent. One fixed value cannot be right for
# both; templates/_helpers.tpl "kubeport.pullPolicy" explains why. Set it here or
# with --set to override the derivation.
images:
  backend:
    repository: ghcr.io/shyuni4u/kubeport-backend
    tag: "latest"
    pullPolicy: ""
  frontend:
    repository: ghcr.io/shyuni4u/kubeport-frontend
    tag: "latest"
    pullPolicy: ""

imagePullSecrets: []  # e.g. [{ name: ghcr-pull-secret }] when using private packages

# ----- Public-facing host -------------------------------------------------
host: kubeport.example.com  # override per environment

# ----- OIDC (issuer + client) --------------------------------------------
# kubeport delegates auth to an external IdP via OIDC. Set issuer to whatever
# IdP you choose (Google: https://accounts.google.com, dex self-hosted, etc.)
oidc:
  issuer: ""          # required — chart fails template render if empty
  # MUST equal the `aud` claim of the IdP's id_token. Google and most IdPs set
  # aud = client_id, so set this to the same value as clientId. Leaving the
  # default with such an IdP makes every login fail token validation (401).
  audience: kubeport
  clientId: ""        # required
  # redirectUri auto-derived from .Values.host if left empty:
  redirectUri: ""
  # OAuth scopes requested at login. Empty = "openid email profile" (works with
  # Google — it rejects an unknown `groups` scope at the consent screen, so leave
  # this empty there). Group-aware IdPs (Dex/Keycloak) can add groups:
  # "openid email profile groups".
  scopes: ""

# ----- Auth secrets -------------------------------------------------------
# Either let the chart create the Secret (auth.create=true) or reference an
# externally managed one (auth.existingSecret). The Secret must contain:
#   APP_ENCRYPTION_KEY_B64, OIDC_CLIENT_SECRET, DATABASE_URL
# and, when dex.enabled=true, a fourth key:
#   DEMO_OIDC_CLIENT_SECRET   (same value as dex.clientSecret)
#
# The fourth one is easy to miss because **nothing fails at install time.** Both
# Deployments take this Secret with `envFrom`, so a missing key is simply an
# unset variable, and the demo-reset CronJob names it with `secretKeyRef` — which
# only surfaces as CreateContainerConfigError when the job first fires. Live, that
# was a demo that emptied itself overnight with every probe still green (#118).
auth:
  create: true
  existingSecret: ""
  # Used only when create=true. Pass via --set or external values file.
  appEncryptionKeyB64: ""   # 32 bytes, base64 — `openssl rand -base64 32`
  oidcClientSecret: ""
  # Comma-separated emails granted in-app admin when the IdP emits no groups
  # claim (e.g. Google). Bootstrap/demo use only. Empty = no bootstrap admin.
  devAdminEmails: ""

# ----- Backend ------------------------------------------------------------
backend:
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Optional non-secret config
  openapiCacheMax: 64
  # How often expired sessions are deleted (Go duration, e.g. "30m"). Empty
  # uses the built-in default of 1h; anything under 1m is clamped to 1m.
  sessionReapInterval: ""
  # Log streams (#169). Empty uses the built-in default.
  # How many log streams one caller (OIDC subject) may hold open at once; the
  # next one gets 429 too-many-streams. Default 16. Empty, 0, a negative number
  # or a non-integer all mean the default — there is no "unlimited". Demo
  # accounts are shared by every visitor, so on a demo install this is roughly
  # how many log panes can be open at once per demo account.
  logStreamsPerCaller: ""
  # How long one log stream stays open before the server ends it and the
  # browser reconnects through a fresh authorization (Go duration, e.g. "30m").
  # Default 1h — the longest a revoked permission keeps receiving logs. Empty,
  # zero or unparseable means the default.
  logStreamMaxLifetime: ""

# ----- Frontend -----------------------------------------------------------
frontend:
  replicaCount: 1
  service:
    port: 3000
  # Public origins this install is served on, e.g.
  # ["https://kubeport.example.com", "https://kp.example.com"]. Login/logout
  # redirects and the logout same-origin check are pinned to this list so a
  # forged X-Forwarded-Host can't steer them. Leave empty for a single domain —
  # the origin of oidc.redirectUri is used then.
  publicOrigins: []
  # Security headers on every response (#80, #143). The frontend sets them at
  # request time from these values, so they can differ per install.
  securityHeaders:
    # false drops all of them — for a proxy in front that sets its own.
    enabled: true
    # Two years, no `preload` (submitting to the preload list is your call).
    # includeSubDomains suits the intended layout — the app plus Dex on its own
    # subdomain, both https — but on an apex domain with sibling http services
    # it forces them onto https in visitors' browsers for two years, with no way
    # back: drop it there. Empty sends no HSTS (a proxy in front already does).
    hsts: "max-age=63072000; includeSubDomains"
    # CSP frame-ancestors sources. 'none' keeps the login screen and the demo
    # buttons out of every iframe; list a portal's origin to embed kubeport.
    frameAncestors: "'none'"
    # "enforce" | "report-only" | "off" — quoted: YAML reads a bare off as
    # false, and the chart refuses anything else. The default policy stops scripts, styles,
    # fonts, frames and connections from foreign origins, allowing only
    # cdn.jsdelivr.net, where the YAML editor (Monaco) loads from. report-only
    # sends it as Content-Security-Policy-Report-Only (frame-ancestors still
    # enforced) to see what it would block; off sends only frame-ancestors.
    cspMode: "enforce"
    # A whole policy replacing the default; frame-ancestors is appended. Empty
    # uses the default in frontend/lib/security-headers.ts.
    contentSecurityPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi

# ----- Postgres -----------------------------------------------------------
postgres:
  embedded: true
  # When embedded=true, chart provisions a single-replica StatefulSet.
  # When embedded=false, set externalUrl to a postgres:// connection string.
  externalUrl: ""
  image: postgres:16-alpine
  user: kubeport
  database: kubeport
  password: ""               # required when embedded=true
  storage:
    size: 10Gi
    storageClassName: ""     # cloud-specific; "" = cluster default
  service:
    port: 5432
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ----- Ingress ------------------------------------------------------------
ingress:
  enabled: true
  className: traefik         # k3s default; GKE = "gce", nginx = "nginx"
  # kubeport accepts request bodies up to 4 MiB. ingress-nginx caps them at 1m
  # by default and answers its own HTML 413 first; with className=nginx set:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "4m"
  annotations: {}
  # tls handled by .Values.tls below
  # Redirect plain http to https on the app and Dex hosts (#268). Without it
  # the whole app is served over http too, and the HSTS header it sends is
  # ignored by a browser that receives it over http (RFC 6797 §8.1) — a first
  # visit stays on http, where the Secure auth cookies cannot even be stored.
  #
  # Rendered only with className "traefik" and TLS on, as a Traefik
  # `traefik.io/v1alpha1` Middleware (k3s ships the CRD). Other ingress classes
  # need their own mechanism (nginx: ssl-redirect is on by default with TLS).
  # Set false on a Traefik without the traefik.io CRDs (older than v2.10, or
  # installed with --skip-crds) — the install fails with no matches for kind
  # "Middleware" — or with its kubernetesCRD provider off, where the install
  # succeeds but the Ingress routers cannot resolve the Middleware and both hosts
  # answer 404, https included. Also set false when
  # something in front already redirects, or when something in front terminates
  # TLS and forwards plain http to Traefik (Cloudflare "Flexible" SSL, an L7 load
  # balancer with an http backend): Traefik does not trust that proxy's
  # X-Forwarded-Proto by default, so every request is redirected again and the
  # site loops (ERR_TOO_MANY_REDIRECTS). cert-manager's HTTP-01 challenge
  # keeps working: its solver gets its own route, and Let's Encrypt follows a
  # redirect to https without checking the certificate.
  httpsRedirect: true

tls:
  # Setting this to false makes the derived oidc.redirectUri http://, and that
  # URI is also the default public-origin allowlist. So if TLS is terminated
  # outside the cluster (Cloudflare, an external LB) and you set this to false,
  # put the https origin the browser actually sees in frontend.publicOrigins —
  # otherwise logout answers 403 and the post-login redirect downgrades to http.
  enabled: true
  # cert-manager Certificate (recommended)
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  # Or reference a pre-existing TLS Secret (skip cert-manager block above)
  existingSecret: ""

# ----- Migration (atlas schema apply, runs as backend initContainer) -----
migration:
  enabled: true
  # Pin a specific tag — `:latest` would silently shift between deploys and
  # reproducibility matters for migration logic. Bump deliberately.
  image: arigaio/atlas:0.30.0
  # The chart mounts files/schema.hcl + a chart-generated atlas.hcl via the
  # migration ConfigMap. See chart README for the schema sync workflow.

# ----- Pod-level common settings -----------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ----- Dex (optional self-hosted demo IdP) --------------------------------
# Static-password OIDC IdP for a public demo login, alongside the primary
# oidc.* IdP (e.g. Google). Backend accepts tokens from both issuers
# (KBP_OIDC_ISSUERS). See README "Demo mode (Dex)" for setup.
# Requires demo.enabled=true: demo mode is what scopes these accounts, and the
# chart refuses to render Dex without it (#253).
dex:
  enabled: false
  host: ""                       # e.g. dex.kubeport.enzo.kr (required when enabled)
  image: ghcr.io/dexidp/dex:v2.39.0
  clientId: kubeport-demo
  clientSecret: ""                # --set, never commit. Also set via an
                                   # external Secret's DEMO_OIDC_CLIENT_SECRET
                                   # key when auth.create=false.
  # bcrypt hashes: htpasswd -bnBC 10 "" '<pw>' | tr -d ':\n'
  staticPasswords:
    - email: demo-admin@demo.kubeport
      username: demo-admin
      userID: demo-admin-000
      hash: ""
    - email: demo-user@demo.kubeport
      username: demo-user
      userID: demo-user-000
      hash: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ----- Demo mode (namespace + quota + RBAC + reset CronJob) --------------
demo:
  enabled: false
  # Namespace for demo RBAC, quota and the reset job, and where the deploy form
  # starts demo sessions (rendered to the frontend as DEMO_NAMESPACE).
  namespace: demo
  # Demo accounts. adminEmail and userEmail must each end in @<emailDomain>
  # (compared case-insensitively, as the backend does) and equal one of
  # dex.staticPasswords[].email exactly — changing an account is two edits. An
  # account outside the domain skips demo scoping, and adminEmail also becomes
  # a full kubeport-admin. The chart refuses to render otherwise (#208, #209);
  # see README "Demo mode (Dex)".
  emailDomain: demo.kubeport
  adminEmail: demo-admin@demo.kubeport
  userEmail: demo-user@demo.kubeport
  passwordHint: ""                # shown on landing (public by design)
  # Let demo accounts author new templates and publish, deprecate or undeprecate
  # versions. Off by default:
  # demo accounts carry kubeport-admin so they can show the admin UX, and
  # authoring is the admin power whose output outlives the visit and reaches
  # other people — a published version can read Secrets other visitors deployed
  # through pod logs (#294). Drafts stay open either way. Their
  # templates are kept out of real users' catalogs either way, but they survive a
  # demo reset once someone deploys from them. Turn on only where demonstrating
  # authoring is the point. See docs/brainstorming-summary.md §14.
  #
  # The reset CronJob does NOT need this: it seeds the catalog through the
  # database, not the API. It did once, and leaving that coupling in place meant
  # a closed gate emptied the live demo every six hours (#104).
  allowTemplateCreate: false
  # Lets the unauthenticated /healthz?verbose=1 (and the BFF's /api/healthz in
  # front of it) report how many templates the catalog holds. Off by default:
  # on a self-hosted install the catalog's size is not the anonymous internet's
  # business. The public demo turns it on so an external cron can tell that a
  # reset wiped and then failed to re-seed — which is otherwise invisible
  # until the next daily reset (#119; #104 was caught only by luck).
  publicHealthCatalog: false
  adminPassword: ""               # --set; used by the reset job only
  userPassword: ""                # --set
  cluster: oci-a1
  # 21:00 UTC = 06:00 KST — the quietest hour for a Korean-audience demo, so a
  # reset is least likely to take a visitor's work away mid-session, and the
  # demo is freshly seeded when the day starts.
  #
  # Daily rather than every six hours because a reset is destructive: it wipes
  # whatever a visitor built. The cost of the longer window is that junk (or a
  # demo someone broke) now sits for up to a day, and a skipped cycle leaves a
  # 48-hour gap instead of 12 — which is exactly why #148 asks for the last
  # successful seed time on /healthz: nothing else can tell a skipped cycle
  # from a healthy one.
  #
  # .github/workflows/uptime-ping.yml fails when catalog.last_seed is older
  # than 26h, which assumes this daily schedule. Change that threshold (to the
  # new interval plus 2h) in the same PR as this value.
  resetSchedule: "0 21 * * *"
  # The banner derives its "next reset" from this same value, and reads only
  # `<minute> <hour|*/N|comma list> * * *`. Forms k8s accepts but the banner
  # does not — `@daily`, ranges like `0-23/6`, `?`, a list of minutes — make
  # it omit the time rather than print a wrong one (#153).
  #
  # The zone the schedule is read in. Leaving it empty hands that decision to
  # whichever zone kube-controller-manager runs in; the banner always assumes
  # UTC, so the two must be pinned together.
  resetTimeZone: "Etc/UTC"
  # Resolve the Dex hostname to this address inside the reset Job, instead of
  # whatever public DNS says. Needed where a Pod cannot reach the cluster's own
  # public address — on OCI that address lives on the edge, not on the node, so
  # a pod-sourced packet to it is never answered while the node reaches the same
  # URL fine. Set it to the ingress address (the node's private IP on a
  # single-node install; `kubectl get svc traefik -n kube-system` shows it).
  #
  # Empty means "use DNS", which is right anywhere the hairpin works.
  resetHostAliasIP: ""
  # bitnami/kubectl tags were pulled from Docker Hub (2025); alpine/k8s ships
  # sh + kubectl for amd64/arm64. The init container needs a shell (sh -c).
  kubectlImage: alpine/k8s:1.31.9
  usernamePrefix: "dex:"          # must match k3s AuthenticationConfiguration
  # Pod Security Admission enforce level for the demo namespace.
  # `baseline` blocks privileged/hostPath/hostNetwork while still allowing
  # ordinary user templates; raise to `restricted` for a stricter demo.
  podSecurityEnforce: baseline

nodeSelector: {}
tolerations: []
affinity: {}
