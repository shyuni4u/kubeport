apiVersion: apps/v1
kind: Deployment
metadata:
  name: kp-kubeport-backend
  labels:
    helm.sh/chart: kubeport-0.1.0
    app.kubernetes.io/name: kubeport
    app.kubernetes.io/instance: kp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeport
      app.kubernetes.io/instance: kp
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        helm.sh/chart: kubeport-0.1.0
        app.kubernetes.io/name: kubeport
        app.kubernetes.io/instance: kp
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: backend
      annotations:
        # Roll the Pod when ConfigMap or Secret content changes.
        checksum/config: 32a011b73e6af8dd51d53c5d406f524f4d2f9aa54c0980e9f8d07783732bb67c
        # schema.hcl 변경 시 backend pod 가 재시작되며 atlas initContainer
        # 가 새 스키마를 적용. 이 어노테이션이 없으면 migration ConfigMap
        # 갱신만으로는 Deployment template 해시가 안 바뀌어 롤이 안 됨.
        checksum/migration: dc17a8ef747dc3fd15eaf566dcf9a8ea1ad781c0bda0abff0e534a2853defc6b
        checksum/secret: e7dde2c9f0d9e6ff324c1fe9ec29e374b1dfb55ceb2fe06c296a8b108aa27451
    spec:
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      # Migration runs as initContainers (not a Helm hook) so that fresh
      # `helm install` works with embedded Postgres — at pre-install hook time
      # the Postgres StatefulSet/Service don't exist yet, so a hook Job can't
      # reach the DB. Atlas schema apply is idempotent; the cost of re-running
      # on each backend pod restart is a few seconds.
      initContainers:
        # Only meaningful for embedded Postgres (in-chart Service). External
        # Postgres is the operator's responsibility to keep reachable; the
        # `migrate` container's own Pod-level restartPolicy retries it on
        # transient connection failure.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              # Block until Postgres TCP port is open. Avoids atlas's
              # immediate DNS-resolution failure on first install.
              until nc -z kp-kubeport-postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
        - name: migrate
          image: "arigaio/atlas:0.30.0"
          workingDir: /migrations
          # ENTRYPOINT ["atlas"] — use args, not command.
          args:
            - schema
            - apply
            - --env
            - prod
            - --auto-approve
          env:
            - name: DATABASE_URL
              value: "postgres://kubeport:golden-snapshot-pgpass@kp-kubeport-postgres:5432/kubeport?sslmode=disable"
          volumeMounts:
            - name: migration-files
              mountPath: /migrations
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: backend
          image: ghcr.io/shyuni4u/kubeport-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kp-kubeport-backend
            - secretRef:
                name: kp-kubeport-auth
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migration-files
          configMap:
            name: kp-kubeport-migrate-files
