        helm.sh/chart: kubeport-0.1.0
        app.kubernetes.io/name: kubeport
        app.kubernetes.io/instance: kp
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: f2cd57a0b4d7e180e94df0535ec84196c3465a4153db84f87b69843527a0f10c
        checksum/secret: e7dde2c9f0d9e6ff324c1fe9ec29e374b1dfb55ceb2fe06c296a8b108aa27451
    spec:
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
