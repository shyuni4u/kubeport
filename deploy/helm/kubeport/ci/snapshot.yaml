            - name: wipe-k8s
              image: "alpine/k8s:1.31.9"
              command: ["sh", "-c"]
              args:
                - kubectl -n demo delete deploy,sts,ds,job,cronjob,svc,cm,secret,pod --all --wait=true --ignore-not-found
