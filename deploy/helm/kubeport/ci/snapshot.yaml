      # Service is responding /healthz — that signals migrations have been
      # applied and the schema is current.
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              until wget -q -O - --timeout=2 http://kp-kubeport-backend:8080/healthz >/dev/null; do
