# Fixed inputs for the golden snapshot CI test. NEVER use these values in real
# deployments. The point is reproducibility, not security.
host: kp.test.local

oidc:
  issuer: https://accounts.google.com
  audience: kubeport
  clientId: golden-snapshot-client
  redirectUri: https://kp.test.local/api/auth/callback

auth:
  create: true
  appEncryptionKeyB64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  oidcClientSecret: golden-snapshot-secret

postgres:
  embedded: true
  password: golden-snapshot-pgpass
  storage:
    storageClassName: standard

ingress:
  enabled: true
  className: traefik

tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod

# A literal, so the snapshot stays byte-stable. `0.1.0` is NOT a tag that exists
# in ghcr — nothing is ever pulled from this file, it only feeds `helm template`.
# Do not read it as the chart's default (that is `latest`, see values.yaml) and
# do not "fix" it to match: changing it rewrites four snapshot lines for nothing.
images:
  backend:
    tag: "0.1.0"
  frontend:
    tag: "0.1.0"

# Dex + demo mode enabled here so the golden snapshot covers those templates.
dex:
  enabled: true
  host: dex.example.test
  clientSecret: test
  staticPasswords:
    # password: demo
    - { email: demo-admin@demo.kubeport, username: demo-admin, userID: demo-admin-000, hash: "$2y$10$wvTSwatbRSSK8WDYkH70LeiRigmZqFsJlz2.8miz8fNrzOm5kFJDG" }
    - { email: demo-user@demo.kubeport,  username: demo-user,  userID: demo-user-000,  hash: "$2y$10$wvTSwatbRSSK8WDYkH70LeiRigmZqFsJlz2.8miz8fNrzOm5kFJDG" }

demo:
  enabled: true
  adminPassword: demo
  userPassword: demo
