{{- if .Values.demo.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-reset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-reset
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-reset
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-reset
subjects:
  - kind: ServiceAccount
    name: demo-reset
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kubeport.fullname" . }}-demo-reset
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.demo.resetSchedule | quote }}
  # Never leave this empty: with no timeZone k8s reads the schedule in
  # kube-controller-manager's local zone, while the banner
  # (frontend/lib/demo-reset.ts) computes it in UTC. On a node set to
  # Asia/Seoul the two would be nine hours apart — #153 again, from the
  # other end. Ignored by API servers below 1.27, which behave as before.
  timeZone: {{ .Values.demo.resetTimeZone | default "Etc/UTC" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: demo-reset
          restartPolicy: Never
          {{- with .Values.demo.resetHostAliasIP }}
          # The seeder authenticates against Dex at its public issuer URL, and
          # on OCI a Pod cannot reach the instance's own public address: the
          # address is not on any interface (the edge NATs it), so a packet
          # from the pod CIDR never comes back — `connect: no route to host`,
          # while the node itself reaches the same URL fine.
          #
          # Pointing the hostname at the ingress address keeps everything else
          # intact: the request still carries that Host and SNI, so the
          # certificate matches, and DEMO_OIDC_ISSUER is unchanged — which
          # matters, because the issuer is compared against the token's `iss`
          # claim. Rewriting the issuer to a service DNS name would break that
          # comparison; rewriting only the resolution does not.
          #
          # Empty by default. Set it where the cluster cannot hairpin its own
          # public address — see the runbook's demo-mode section.
          hostAliases:
            - ip: {{ . | quote }}
              hostnames:
                - {{ $.Values.dex.host | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          initContainers:
            # Runs before wipe-k8s on purpose. The seeder proves its own
            # dependencies before it deletes database rows, but that only
            # governs the seed container: wipe-k8s used to empty the demo
            # namespace with no idea whether the re-seed could succeed, so a
            # Dex outage still destroyed the workloads and left the releases
            # pointing at nothing until the next scheduled run (#105).
            # Failing here fails the Job before anything is destroyed.
            - name: preflight
              image: {{ include "kubeport.backend.image" . }}
              command: ["/seed-demo", "--preflight-only"]
              env:
                {{- include "kubeport.demoSeedEnv" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
            - name: wipe-k8s
              image: {{ .Values.demo.kubectlImage | quote }}
              command: ["sh", "-c"]
              args:
                - kubectl -n {{ .Values.demo.namespace }} delete deploy,sts,ds,job,cronjob,svc,cm,secret,pod --all --wait=true --ignore-not-found
              env:
                # kubectl writes its discovery cache under $HOME/.kube/cache;
                # readOnlyRootFilesystem forces it into the tmp emptyDir below.
                - name: HOME
                  value: /tmp
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: seed
              image: {{ include "kubeport.backend.image" . }}
              command: ["/seed-demo", "--reset"]
              env:
                {{- include "kubeport.demoSeedEnv" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeport.fullname" . }}-demo
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
type: Opaque
data:
  DEMO_ADMIN_PASSWORD: {{ required "demo.adminPassword is required when demo.enabled=true" .Values.demo.adminPassword | b64enc | quote }}
  DEMO_USER_PASSWORD: {{ required "demo.userPassword is required when demo.enabled=true" .Values.demo.userPassword | b64enc | quote }}
{{- end -}}
