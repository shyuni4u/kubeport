apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeport.frontend.fullname" . }}
  labels:
    {{- include "kubeport.frontend.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ include "kubeport.oidc.redirectUri" . | quote }}
  {{- with .Values.frontend.publicOrigins }}
  # Origins the app is served on. Login/logout redirects and the logout
  # same-origin check are pinned to this list, so a forged X-Forwarded-Host
  # cannot steer them. Only needed for multi-domain installs — with this unset
  # the origin of OIDC_REDIRECT_URI above is used.
  PUBLIC_ORIGIN: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.oidc.scopes }}
  OIDC_SCOPES: {{ . | quote }}
  {{- end }}
  GO_API_BASE_URL: {{ printf "http://%s:%v" (include "kubeport.backend.fullname" .) .Values.backend.service.port | quote }}
  {{- if .Values.dex.enabled }}
  DEMO_OIDC_ISSUER: {{ include "kubeport.dex.issuer" . | quote }}
  DEMO_OIDC_CLIENT_ID: {{ .Values.dex.clientId | quote }}
  DEMO_EMAIL_DOMAIN: {{ .Values.demo.emailDomain | quote }}
  DEMO_ADMIN_EMAIL: {{ .Values.demo.adminEmail | quote }}
  DEMO_USER_EMAIL: {{ .Values.demo.userEmail | quote }}
  {{- with .Values.demo.passwordHint }}
  DEMO_PASSWORD_HINT: {{ . | quote }}
  {{- end }}
  {{- end }}
