apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeport.frontend.fullname" . }}
  labels:
    {{- include "kubeport.frontend.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ include "kubeport.oidc.redirectUri" . | quote }}
  {{- with .Values.frontend.publicOrigins }}
  # Origins the app is served on. Login/logout redirects and the logout
  # same-origin check are pinned to this list, so a forged X-Forwarded-Host
  # cannot steer them. Only needed for multi-domain installs — with this unset
  # the origin of OIDC_REDIRECT_URI above is used.
  PUBLIC_ORIGIN: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.oidc.scopes }}
  OIDC_SCOPES: {{ . | quote }}
  {{- end }}
  GO_API_BASE_URL: {{ printf "http://%s:%v" (include "kubeport.backend.fullname" .) .Values.backend.service.port | quote }}
  # Security headers, read by frontend/proxy.ts on every request (#80, #143).
  # They are not in next.config.ts because that is baked at image build time.
  {{- with .Values.frontend.securityHeaders }}
  SECURITY_HEADERS: {{ ternary "on" "off" (ne (toString .enabled) "false") | quote }}
  # Empty = no HSTS header (a proxy in front already sends one).
  SECURITY_HSTS: {{ .hsts | default "" | quote }}
  SECURITY_FRAME_ANCESTORS: {{ .frameAncestors | default "'none'" | quote }}
  SECURITY_CSP_MODE: {{ .cspMode | default "enforce" | quote }}
  {{- with .contentSecurityPolicy }}
  SECURITY_CSP: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.dex.enabled }}
  DEMO_OIDC_ISSUER: {{ include "kubeport.dex.issuer" . | quote }}
  DEMO_OIDC_CLIENT_ID: {{ .Values.dex.clientId | quote }}
  DEMO_EMAIL_DOMAIN: {{ .Values.demo.emailDomain | quote }}
  # The banner computes the next reset from this. It used to be a constant in
  # the frontend, which meant changing the CronJob left the banner telling
  # visitors a time 15 hours off (#153) — one cadence, one source.
  DEMO_RESET_SCHEDULE: {{ .Values.demo.resetSchedule | quote }}
  DEMO_ADMIN_EMAIL: {{ .Values.demo.adminEmail | quote }}
  DEMO_USER_EMAIL: {{ .Values.demo.userEmail | quote }}
  # The deploy form starts demo sessions in this namespace, because demo
  # accounts' RBAC covers it alone — the cluster's own default_namespace would
  # open the form on a permission denial (#179). Same value demo-rbac.yaml and
  # the reset job use.
  DEMO_NAMESPACE: {{ .Values.demo.namespace | quote }}
  {{- with .Values.demo.passwordHint }}
  DEMO_PASSWORD_HINT: {{ . | quote }}
  {{- end }}
  {{- end }}
