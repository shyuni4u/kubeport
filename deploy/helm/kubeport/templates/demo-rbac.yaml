{{- if .Values.demo.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-admin
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
rules:
  # Explicitly enumerated: no resourcequotas / limitranges / networkpolicies
  # (the demo guardrails must not be editable from inside the demo), no
  # pods/exec, no networking.k8s.io (ingress is quota-blocked anyway).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets", "events", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-user
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "services", "configmaps", "deployments", "statefulsets", "jobs", "cronjobs", "events", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]   # no get/list: users can write but not read back secrets
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-admin
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-admin
subjects:
  - kind: User
    name: {{ printf "%s%s" .Values.demo.usernamePrefix .Values.demo.adminEmail | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-user
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-user
subjects:
  - kind: User
    name: {{ printf "%s%s" .Values.demo.usernamePrefix .Values.demo.userEmail | quote }}
---
# SelfSubjectAccessReview is cluster-scoped; demo users need it for the RBAC panel.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeport.fullname" . }}-demo-ssar
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeport.fullname" . }}-demo-ssar
  labels:
    {{- include "kubeport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeport.fullname" . }}-demo-ssar
subjects:
  - kind: User
    name: {{ printf "%s%s" .Values.demo.usernamePrefix .Values.demo.adminEmail | quote }}
  - kind: User
    name: {{ printf "%s%s" .Values.demo.usernamePrefix .Values.demo.userEmail | quote }}
{{- end -}}
