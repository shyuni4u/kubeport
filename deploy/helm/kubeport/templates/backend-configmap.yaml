apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeport.backend.fullname" . }}
  labels:
    {{- include "kubeport.backend.labels" . | nindent 4 }}
data:
  LISTEN_ADDR: {{ printf ":%v" .Values.backend.service.port | quote }}
  OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  OIDC_AUDIENCE: {{ required "oidc.audience is required" .Values.oidc.audience | quote }}
  KBP_OIDC_ISSUERS: {{ include "kubeport.oidcIssuersJSON" . | quote }}
  KBP_OPENAPI_CACHE_MAX: {{ .Values.backend.openapiCacheMax | quote }}
  {{- with .Values.backend.sessionReapInterval }}
  # How often expired sessions are deleted (Go duration). Default 1h; values
  # below 1m are clamped.
  KBP_SESSION_REAP_INTERVAL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.logStreamsPerCaller }}
  # Log streams one caller may hold open at once. Default 16 (#169).
  KBP_LOG_STREAMS_PER_CALLER: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.logStreamMaxLifetime }}
  # How long one log stream stays open before the browser reconnects and is
  # authorized again (Go duration). Default 1h (#169).
  KBP_LOG_STREAM_MAX_LIFETIME: {{ . | quote }}
  {{- end }}
  {{- if .Values.demo.enabled }}
  KBP_DEMO_EMAIL_DOMAIN: {{ .Values.demo.emailDomain | quote }}
  {{- if .Values.demo.allowTemplateCreate }}
  # Lets demo accounts author templates. Off by default — demo accounts carry
  # kubeport-admin, and authoring is the one admin power whose output outlives
  # the visit. Their templates stay out of real users' catalogs either way, but
  # they survive a demo reset once someone deploys from them.
  KBP_DEMO_ALLOW_TEMPLATE_CREATE: "true"
  {{- end }}
  {{- if .Values.demo.publicHealthCatalog }}
  # Lets the unauthenticated /healthz?verbose=1 report the catalog size, so an
  # external cron can tell a wiped-but-unseeded demo from a healthy one (#119).
  # Off by default — a self-hosted install should not disclose it.
  KBP_HEALTH_PUBLIC_CATALOG: "true"
  {{- end }}
  {{- with .Values.demo.policy }}
  # Limits on demo accounts' manifests (#350); an unset key turns a rule off.
  {{- $policy := . }}
  {{- range $key, $env := dict "jobBackoffLimit" "KBP_DEMO_JOB_BACKOFF_LIMIT" "jobTTLSecondsAfterFinished" "KBP_DEMO_JOB_TTL_SECONDS" "cronJobHistoryLimit" "KBP_DEMO_CRONJOB_HISTORY_LIMIT" }}
  {{- $v := index $policy $key }}
  {{- if not (kindIs "invalid" $v) }}
  {{- $s := toString $v }}
  {{- /* A number from a values file arrives as a float: 1000000 would print as 1e+06. */}}
  {{- if and (kindIs "float64" $v) (eq $v (floor $v)) }}
  {{- $s = int64 $v | toString }}
  {{- end }}
  {{- if not (regexMatch "^[0-9]+$" $s) }}
  {{- fail (printf "demo.policy.%s must be a whole number of zero or more, or null to turn the rule off (got %v)" $key $v) }}
  {{- end }}
  {{ $env }}: {{ $s | quote }}
  {{- end }}
  {{- end }}
  {{- with .allowedImagePrefixes }}
  {{- if not (kindIs "slice" .) }}
  {{- fail (printf "demo.policy.allowedImagePrefixes must be a list, e.g. --set 'demo.policy.allowedImagePrefixes={ghcr.io/nginx/,docker.io/library/busybox}' (got %v)" .) }}
  {{- end }}
  {{- range . }}
  {{- if or (not (kindIs "string" .)) (eq . "") (contains "," .) }}
  {{- fail (printf "demo.policy.allowedImagePrefixes entries must be non-empty strings without commas (got %v)" .) }}
  {{- end }}
  {{- end }}
  KBP_DEMO_ALLOWED_IMAGE_PREFIXES: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with include "kubeport.devAdminEmails" . }}
  # Bootstrap admin(s): matching login emails are granted the kubeport-admin
  # group in-app. Intended for demo/bootstrap when the IdP (e.g. Google) emits
  # no groups claim. Leave empty for group-aware IdPs. Includes demo.adminEmail
  # when demo.enabled=true.
  KBP_DEV_ADMIN_EMAILS: {{ . | quote }}
  {{- end }}
