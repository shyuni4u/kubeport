# Phase 2 (OCI Always Free A1.Flex) — see ADR 0003.
#
# Target: OCI VM.Standard.A1.Flex (Ampere ARM, 4 OCPU / 24 GB) with k3s
# single-node. This is the long-term hosting target — $0 forever as long as
# Always Free capacity holds.
#
# Differences vs Phase 1 (GCP):
#  - Same ingress.className (traefik) and storageClassName (local-path) since
#    k3s is identical.
#  - Resources are *not* bumped from defaults: the A1 box has plenty of
#    headroom, and keeping limits tight makes idle reclaim less likely (low
#    memory request = low memory usage signal).
#  - Larger Postgres PVC (10 → 20 GiB) since the A1 boot volume gives 100 GB
#    out of an Always Free 200 GB pool, so storage is cheap and we won't have
#    to resize for a long while.
#
# Replace the <PLACEHOLDER> values before installing. Secrets MUST NOT be
# committed, and should not go on the command line either: a --set value is in
# helm's arguments (ps) while it runs, and a typed one stays in shell history.
# Write them to files and pass the files — deploy/oci/README.md §4 has the full
# steps, and the chart README "Keeping secrets off the command line" the why:
#
#   helm install kubeport deploy/helm/kubeport \
#     -f deploy/helm/kubeport/values-oci-phase2.yaml \
#     --namespace kubeport --create-namespace \
#     --set host=<your-host> \
#     --set oidc.clientId=$GOOGLE_OAUTH_CLIENT_ID \
#     --set oidc.audience=$GOOGLE_OAUTH_CLIENT_ID \
#     --set-string auth.devAdminEmails=$YOUR_EMAIL \
#     --set-file auth.appEncryptionKeyB64="$d/enc_key" \
#     --set-file auth.oidcClientSecret="$d/oidc_client_secret" \
#     --set-file postgres.password="$d/pg_pass"

host: <your-domain.example>     # required — set via --set on install

oidc:
  # Google OAuth (OIDC) — recommended for Phase 2. No self-hosted IdP to
  # operate. Set up at https://console.cloud.google.com/apis/credentials.
  # Authorized redirect URI: https://<host>/api/auth/callback
  issuer: https://accounts.google.com
  # Google's id_token carries aud = client_id, so audience MUST be set to the
  # same value as clientId. Leaving a literal like `kubeport` here makes every
  # login fail token validation with 401.
  audience: <set-via-flag>
  clientId: <set-via-flag>
  # redirectUri auto-derived from host

auth:
  create: true
  # appEncryptionKeyB64 / oidcClientSecret — pass via --set, never commit.
  # appEncryptionKeyB64 once set cannot be rotated without re-encrypting all
  # encrypted columns in the DB. Store it in a password manager at install.
  appEncryptionKeyB64: ""
  oidcClientSecret: ""

backend:
  replicaCount: 1

frontend:
  replicaCount: 1

postgres:
  embedded: true
  password: ""                  # pass via --set
  storage:
    size: 20Gi                  # A1 has 200 GB free block storage, generous
    storageClassName: local-path  # k3s default
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

ingress:
  enabled: true
  className: traefik             # k3s default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod  # provisioned by deploy/oci/bootstrap.sh

migration:
  enabled: true

images:
  backend:
    repository: ghcr.io/shyuni4u/kubeport-backend
    tag: ""                      # empty = appVersion. Pin a SHA before going public.
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/shyuni4u/kubeport-frontend
    tag: ""
    pullPolicy: IfNotPresent

# Resource pressure: A1.Flex is 4 OCPU / 24 GiB. Defaults in values.yaml fit
# with massive headroom — k3s + cert-manager + traefik take ~600 MiB total,
# leaving ~20+ GiB for app pods.

# ----- Demo mode (public Dex demo login) ----------------------------------
# See deploy/helm/kubeport/README.md "Demo mode (Dex)" and
# deploy/oci/README.md §7.6 (k3s must trust the Dex issuer).
#
# Both stay `enabled: false` here on purpose: enabling them makes the chart
# `required` several secrets (dex.clientSecret, the two bcrypt hashes, the two
# demo passwords), which would break every routine `helm upgrade -f` that does
# not carry them. Turn demo mode on once with an explicit --set list (see
# deploy/oci/README.md, "Upgrade" + §7.6); afterwards `--reuse-values` keeps it.
dex:
  enabled: false
  host: dex.kubeport.enzo.kr
  clientSecret: ""             # --set-file dex.clientSecret=<file> (deploy/oci/README.md §7.6)
  staticPasswords:             # hashes via: htpasswd -bnBC 10 "" "$DEMO_PW" | tr -d ':\n'
    - { email: demo-admin@demo.kubeport, username: demo-admin, userID: demo-admin-000, hash: "" }
    - { email: demo-user@demo.kubeport,  username: demo-user,  userID: demo-user-000,  hash: "" }

demo:
  enabled: false
  cluster: oci-a1
  # This is the public demo, so the catalog size is already visible to anyone
  # who clicks through. Publishing it on /healthz lets uptime-ping.yml notice a
  # reset that wiped and failed to re-seed, instead of the demo sitting empty
  # until the next daily run (#119).
  publicHealthCatalog: true
  passwordHint: ""             # --set demo.passwordHint=$DEMO_PW  (public)
  adminPassword: ""            # --set
  userPassword: ""             # --set
